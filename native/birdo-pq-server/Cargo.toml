[package]
name = "birdo-pq-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Server-side BirdoPQ v1 helper — encapsulates against a client ML-KEM-1024 public key and prints (ciphertext, psk)."
license = "Apache-2.0"

[[bin]]
name = "birdo-pq-server"
path = "src/main.rs"

[dependencies]
# Same KEM the Android client uses -- and the same feature set, on purpose.
#
# This was the last pqcrypto-mlkem twin still on default features (avx2, neon,
# std) after #353 fixed native/rosenpass-jni. This binary is not built or
# deployed today, but an aarch64 build of it would carry the identical ungated
# FEAT_SHA3 path that SIGILLed every non-SHA3 arm64 phone on 1.4.25, and a
# server that dies in keygen is no better than a client that does. CLEAN-only
# everywhere; scripts/check_pq_features.sh fails the build if any native crate
# drifts back. See native/README.md § ISA baseline.
pqcrypto-mlkem = { version = "0.1", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"

# PSK derivation — must match the client side bit-for-bit.
sha2 = "0.10"
hkdf = "0.12"

# Wire encoding.
base64 = "0.22"

# CSPRNG via getrandom (the OS entropy source). pqcrypto already pulls this
# in transitively, but we list it explicitly so version pinning is auditable.
getrandom = { version = "0.2", features = ["std"] }

# Defence-in-depth: wipe shared secrets from RAM after derivation.
zeroize = { version = "1.7", features = ["zeroize_derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true
