[package]
name = "rosenpass-jni"
version = "0.2.1"
edition = "2021"
# ml-kem and its chain (kem, sha3, keccak, hybrid-array, module-lattice) are
# edition 2024 with rust-version = "1.85". Declared here so an older toolchain
# fails with a message that names the requirement instead of an edition error
# inside a dependency. See rust-toolchain.toml.
rust-version = "1.85"
publish = false
description = "BirdoPQ post-quantum WireGuard PSK derivation — JNI bindings for the Birdo Android client."
license = "Apache-2.0"

[lib]
name = "rosenpass_jni"
crate-type = ["cdylib"]

[dependencies]
# JNI surface
jni = { version = "0.21", default-features = false }

# Logging into Android logcat from Rust
log = "0.4"
android_logger = "0.13"

# Crypto primitives — HKDF + SHA-256 for the final PSK derivation
sha2 = "0.10"
hkdf = "0.12"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Post-quantum primitive: ML-KEM-1024 (FIPS 203), the strongest standardised
# NIST PQ KEM. Public key 1568 B, secret key 3168 B, shared secret 32 B.
#
# ── DECISION RECORD: RustCrypto ml-kem, exact-pinned ───────────────────────
#
# Status 2026-09-16. This replaced `pqcrypto-mlkem` (PQClean's portable CLEAN
# C) after the 1.4.25 SIGILL post-mortem. Read all four points before changing
# this line; three of them are counter-intuitive.
#
# 1. WHY WE LEFT pqcrypto-mlkem.
#    Not because it was wrong — it was correct, and its bytes are what is
#    sealed on every existing device. Because it is DEAD. PQClean upstream was
#    archived read-only on 2026-08-04 (PQClean/PQClean#604), so no further
#    security patch will ever land on the C we shipped, and RustSec filed
#    three unmaintained advisories on 2026-06-04: RUSTSEC-2026-0161
#    (pqcrypto-mlkem), -0162 (pqcrypto-traits), -0163 (pqcrypto-internals).
#    RUSTSEC-2026-0161's own remediation text reads "Users should migrate to
#    the `ml-kem` crate."
#
# 2. WHAT THIS DOES *NOT* FIX: the FEAT_SHA3 opcodes.
#    The 1.4.25 crash was PQClean's AArch64 ML-KEM reaching ARMv8.2 FEAT_SHA3
#    instructions (eor3/rax1/xar/bcax in pqclean/common/keccak2x/feat.S) with
#    a compile-time-only selection — the estate's own note recorded the gate
#    as a literal `if true`. A DEFAULT aarch64 build of ml-kem contains the
#    SAME FOUR MNEMONICS: ml-kem 0.3.2 -> sha3 0.11 -> keccak 0.2.2 ships
#    src/backends/aarch64_sha3.rs, adapted from the same XKCP/K12
#    KeccakP-1600-ARMv8Asha3.S PQClean vendored. Measured: 64 instructions,
#    eor3=10, rax1=5, xar=24, bcax=25.
#
#    What changed is the GATE, not the absence of opcodes:
#      keccak-0.2.2/src/lib.rs:17     cpufeatures::new!(armv8_sha3_intrinsics, "sha3")
#      keccak-0.2.2/src/lib.rs:81-91  if self.armv8_sha3.get() { ...fast... } else { soft }
#      cpufeatures-0.3.1/src/aarch64.rs  getauxval(AT_HWCAP) & (HWCAP_SHA3|HWCAP_SHA512)
#    That is exactly the runtime dispatch PQClean's aarch64 path lacked.
#    Anyone who writes "the pure-Rust crate removes the C/asm path so the
#    crash class is structurally impossible" is wrong (PQ-DOCS-OK: quoted to
#    scripts/check_pq_docs.sh fails the build for saying it.
#
# 3. HOW THE ANDROID BUILD GETS TO ZERO ANYWAY.
#    `--cfg keccak_backend="soft"` in native/rosenpass-jni/.cargo/config.toml
#    takes the early-return arm in keccak's with_backend(), after which the
#    aarch64_sha3 module is unreferenced and lto + gc-sections drop it at LINK
#    time. The shipped .so then carries 0 extended-ISA instructions and
#    scripts/check_no_sha3_ext.sh stays STRICT with no per-site exception.
#    It MUST live in .cargo/config.toml and nowhere else: app/build.gradle.kts
#    lists that file as a buildRustLibs input, so a cfg set in a workflow
#    RUSTFLAGS or a shell env var would not invalidate the Gradle task and
#    could ship a stale UP-TO-DATE .so. scripts/check_pq_features.sh asserts
#    both the presence here and the absence elsewhere.
#
#    The known way to re-arm the crash is RUSTFLAGS='-C target-feature=+sha3'
#    (or any -C target-cpu above the fleet floor): cpufeatures' internal
#    __unless_target_features! macro ELIDES the HWCAP check and returns a
#    constant true when the feature is statically enabled. android.yml builds
#    that configuration on purpose and asserts the ISA gate FAILS on it.
#
# 4. THE PIN IS A CRYPTO DECISION, NOT A DEPENDENCY ONE.
#    ml-kem is pre-1.0 and fast-moving: 0.3.0 removed the Kem struct and
#    KemCore trait; the FIPS 203 input validations did not exist until April
#    2026; DecapsulationKey's Zeroize was wrong until May 2026; and its
#    changelog permits MSRV bumps in patch releases. Hence `=0.3.2`. Treat any
#    bump as a crypto change: re-run the KAT (handshake.rs `kat_vs_noble`),
#    the install-base guard (`stored_pqclean_dk_loads_and_derives_same_psk`)
#    and the ISA gate before merging.
#
#    It is also UNAUDITED — its README says so in as many words. So was
#    PQClean, and so is @noble/post-quantum on the SERVER (its README:
#    "has not been independently audited yet"; self-audited at 0.6.1, Apr
#    2026 — an earlier version of this note wrongly called it audited).
#    What the system DOES have is cross-implementation agreement: the tests
#    in handshake.rs assert byte-equality against a fixture the server
#    implementation generated. The external review RFP lives in
#    BirdoVPN/Architecture audits/PQ-CRYPTO-REVIEW-RFP.md.
#
# Features, deliberately minimal:
#   alloc     — required by module-lattice's MaybeBox heap offload (default).
#   zeroize   — NOT on by default (ml-kem's default = ["alloc"] only). Without
#               it DecapsulationKey's ZeroizeOnDrop is #[cfg]'d out and key
#               material is never wiped.
#   getrandom — the OS CSPRNG, i.e. getrandom(2) on Android. This is the same
#               entropy source pqcrypto used (pqcrypto-internals routed
#               PQClean's randombytes through the getrandom crate). The
#               alternative is a hand-written rand_core 0.10 adapter in the
#               crypto path, which is worse.
#   hazmat    — dev-dependencies ONLY, for encapsulate_deterministic() in the
#               KAT test. Never in a shipped build.
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc", "zeroize", "getrandom"] }

# getauxval(AT_HWCAP / AT_HWCAP2) for nativeCpuFeatures(): the kernel's own
# statement of which optional ISA extensions this CPU has. Read-only, one
# syscall-free libc call, no allocation. Bionic exposes it on every API level
# we ship to (getauxval is API 18+). Off Android/Linux the export returns zeros.
[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
hex = "0.4"
# Only the KAT test re-parses the JSON fixtures; nothing on the wire is
# base64-encoded in Rust (the Kotlin bridge does that).
base64 = "0.22"
# `hazmat` un-hides EncapsulationKey::encapsulate_deterministic, which the
# cross-implementation KAT needs to reproduce the server's exact ciphertext
# from the fixture's encapsulation randomness. Test profiles only.
ml-kem = { version = "=0.3.2", default-features = false, features = ["alloc", "zeroize", "getrandom", "hazmat"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# Keep the symbol table (function names) but drop the heavy DWARF debug info, so
# the shipped librosenpass_jni.so stays small yet is symbolicatable. AGP's
# `debugSymbolLevel = "FULL"` (app/build.gradle.kts) then bundles these symbols
# into the AAB for Play Console native crash/ANR symbolication. With the old
# `strip = "symbols"` the lib was fully stripped, so the AAB carried no native
# debug symbols and Play warned on every upload.
strip = "debuginfo"
panic = "abort"
overflow-checks = true

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true
