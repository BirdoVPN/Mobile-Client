[package]
name = "rosenpass-jni"
version = "0.2.1"
edition = "2021"
publish = false
description = "BirdoPQ post-quantum WireGuard PSK derivation — JNI bindings for the Birdo Android client."
license = "Apache-2.0"

[lib]
name = "rosenpass_jni"
crate-type = ["cdylib"]

[dependencies]
# JNI surface
jni = { version = "0.21", default-features = false }

# Logging into Android logcat from Rust
log = "0.4"
android_logger = "0.13"

# Crypto primitives — HKDF + SHA-256 for the final PSK derivation
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
zeroize = { version = "1.7", features = ["zeroize_derive"] }

# Random for ephemeral material (uses the OS CSPRNG via getrandom)
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["std"] }

# Post-quantum primitive: ML-KEM-1024 (FIPS 203), the strongest standardised
# NIST PQ KEM. Public key ~1568 B, ciphertext ~1568 B, shared secret 32 B.
# This is the same KEM Mullvad uses in their PQ-PSK product.
# NO DEFAULT FEATURES -- this is a crash fix, not a preference.
#
# pqcrypto-mlkem's defaults are ["avx2", "neon", "std"]. With `neon` on, build.rs
# compiles PQClean's AArch64 ML-KEM and sets `enable_aarch64_neon`, which switches
# the FFI bindings from PQCLEAN_MLKEM1024_CLEAN_* to PQCLEAN_MLKEM1024_AARCH64_*.
# That path pulls in pqclean/common/keccak2x/feat.S, which uses 64 ARMv8.2 SHA3
# instructions -- eor3 x10, rax1 x5, xar x24, bcax x25 -- with no `.arch` guard
# and, critically, NO RUNTIME CPU DETECTION. The selection is compile-time only:
#
#     if target_arch == "aarch64" && neon_enabled { build_aarch64!("ml-kem-1024"); }
#
# FEAT_SHA3 is OPTIONAL in ARMv8.2-A. On any arm64 device without it, the first
# `eor3` executed raises SIGILL and the process dies. That is a hard crash in
# nativeGenerateKeypair, i.e. before a tunnel can be established at all, and with
# PQ default-ON it takes the whole connection with it. Reported in production on
# 1.4.25 from a Galaxy A70 (Snapdragon 675 / Kryo 460 -- ARMv8.2-A WITHOUT
# FEAT_SHA3), and it applies to every mid-range SoC that omits the extension.
#
# The portable CLEAN implementation is plain C and runs on every arm64. ML-KEM
# keygen there is on the order of a few hundred microseconds and happens once per
# handshake, so the cost is not measurable next to the network round trip -- and
# a slower handshake beats a SIGILL for every affected user.
#
# Restoring the optimised path needs runtime dispatch on getauxval(AT_HWCAP) &
# HWCAP_SHA3, which this crate does not offer. Do not re-enable `neon` without it.
#
# ── DECISION RECORD: portable CLEAN only, deliberately ─────────────────────
#
# Status (2026-09-16, post-mortem of the 1.3.25..1.4.25 SIGILL): the shipped
# configuration is PQClean's portable CLEAN C on every ABI. No runtime dispatch,
# no vendored asm. This is a choice, not a stopgap:
#
#   * One code path means one thing to audit and one thing the gates have to
#     reason about. CLEAN is the reference the optimised implementations are
#     validated against; under QEMU the CLEAN, AArch64 and plain-NEON builds
#     produced bit-identical derandomised keypairs on every core model tried.
#   * The failure mode of a wrong dispatch is exactly the crash we shipped.
#   * Cost, measured under QEMU TCG on an x86 host (EMULATED, relative only --
#     no physical-device timing exists): keypair CLEAN ~0.33 ms vs ~0.21 ms for
#     the AArch64+SHA3 path; full keypair+enc+dec ~1.25 ms vs ~0.68 ms. Keygen
#     runs once per connect, next to a network round trip. Invisible.
#
# Controls that keep it this way (all fail the build, none are advisory):
#   scripts/check_pq_features.sh   -- resolved feature set must be exactly {std}
#                                     in every native crate, every target
#   scripts/check_no_sha3_ext.sh   -- every shipped .so disassembled; any
#                                     optional-extension opcode outside a
#                                     verified runtime guard fails (PR debug
#                                     APK, release APK, release AAB, and the
#                                     local native/build.sh|ps1 output)
#   scripts/tests/check_no_sha3_ext_test.sh -- proves the gate bites on
#                                     hand-assembled eor3/LSE/AVX2 fixtures
#   nativeCpuFeatures()/nativeImplName() -- HWCAP words and the impl name are
#                                     logged at load and tagged on Sentry, so
#                                     the next native crash says which feature
#                                     the device lacked
#
# To re-evaluate (owner decision, not a follow-up): needs (a) a keygen cost
# measured on a real device that moves a user-visible metric, (b) an upstream
# pqcrypto-mlkem that dispatches on getauxval(AT_HWCAP) & HWCAP_SHA3 -- or a
# vendored PQClean aarch64 tree built WITHOUT +sha3 (the plain-NEON fallback in
# fips202x2.c) -- and (c) a QEMU matrix run plus at least one SHA3-less
# physical device (Snapdragon 6xx/7xx/888, Helio G8x/G9x) in the acceptance
# test. Any such change must also update EXPECTED_FEATURES in
# scripts/check_pq_features.sh; the disassembly gate will then be the thing
# that proves the dispatch is real.
#
# Upstream: the real fix is in rustpq/pqcrypto (gate keccak2x's +sha3 behind a
# feature in pqcrypto-internals' build.rs; add HWCAP dispatch in
# pqcrypto-mlkem). Not filed as of 2026-09-16 -- owner decision; record the
# issue/PR link here when it exists. Until it is merged, the three controls
# above are the protection.
pqcrypto-mlkem = { version = "0.1", default-features = false, features = ["std"] }
pqcrypto-traits = "0.3"

# Encoding for keys / handshake messages on the wire
base64 = "0.22"

# getauxval(AT_HWCAP / AT_HWCAP2) for nativeCpuFeatures(): the kernel's own
# statement of which optional ISA extensions this CPU has. Read-only, one
# syscall-free libc call, no allocation. Bionic exposes it on every API level
# we ship to (getauxval is API 18+). Off Android/Linux the export returns zeros.
[target.'cfg(any(target_os = "android", target_os = "linux"))'.dependencies]
libc = "0.2"

[dev-dependencies]
hex = "0.4"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# Keep the symbol table (function names) but drop the heavy DWARF debug info, so
# the shipped librosenpass_jni.so stays small yet is symbolicatable. AGP's
# `debugSymbolLevel = "FULL"` (app/build.gradle.kts) then bundles these symbols
# into the AAB for Play Console native crash/ANR symbolication. With the old
# `strip = "symbols"` the lib was fully stripped, so the AAB carried no native
# debug symbols and Play warned on every upload.
strip = "debuginfo"
panic = "abort"
overflow-checks = true

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true
