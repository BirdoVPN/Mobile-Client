version: 2
updates:
  # Gradle (Android + KMP shared)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "android"
    # Don't bump dependencies that require a newer Kotlin than we currently use.
    ignore:
      # Ktor is declared by :shared but imported by nothing there yet, and it is
      # what pulls okhttp to 5.2.1 on releaseRuntimeClasspath (see
      # app/proguard-rules.pro) — a major bump is a shipped-artifact change.
      - dependency-name: "io.ktor:*"
        versions: [">=3.4.0"]
      # Major bumps that require code/Gradle migrations - hold for manual upgrade
      - dependency-name: "androidx.compose.compiler:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.squareup.retrofit2:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "androidx.compose:compose-bom"
        update-types: ["version-update:semver-major"]
      # The 9.x migration is DONE (wrapper 9.7.1 on AGP 9.4.0 since OPEN-WORK
      # G4). Hold only the next major so 9.x patches keep flowing.
      - dependency-name: "gradle"
        versions: [">=10.0.0"]
      # Kotlin moves as ONE coordinated set (KGP, Compose compiler plugin,
      # serialization plugin, KSP, Hilt — 2.4.10 / 2.3.12 / 2.60.1 since
      # OPEN-WORK G4, 2026-09-13) and the iOS Kotlin/Native side only builds in
      # ios.yml, never in PR CI. Hold minor+ so a single-line bump cannot land.
      - dependency-name: "org.jetbrains.kotlin:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # GRADLE PLUGIN IDS are a SEPARATE namespace from Maven coordinates.
      #
      # The rule above uses "group:artifact" form, which matches the Kotlin
      # LIBRARIES. It does NOT match the plugin declarations in
      # build.gradle.kts, which are plain ids:
      #   org.jetbrains.kotlin.multiplatform / .plugin.compose
      #   / .plugin.serialization
      # so Dependabot kept raising the very bumps the rule above exists to hold
      # (and which were already closed once as blocked on the AGP 9 wall).
      #
      # com.android.application / com.android.library below were already
      # correctly declared in plugin-id form; Kotlin and Hilt were not.
      - dependency-name: "org.jetbrains.kotlin.*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # CODEQL CEILING - and why the two holds above were not enough.
      #
      # 2.4.10 -> 2.4.20 is a PATCH in semver terms (major 2, minor 4, patch 10
      # -> 20), so it sails straight past both minor+major holds. Dependabot
      # raised it as #413 and Analyze (java-kotlin) failed with
      #   "Kotlin version 2.4.20 is too recent. CodeQL currently supports
      #    versions below 2.4.20"
      # (run 35461522606). That PR can never go green - CodeQL is a required
      # check and no rebase moves the extractor's ceiling.
      #
      # build.gradle.kts has carried exactly this warning in a comment since G4.
      # A comment cannot stop Dependabot. This rule can.
      #
      # A CEILING rather than a patch hold, deliberately: ">=2.4.20" also covers
      # every minor and major reachable from 2.4.10 (2.4.21, 2.5.0 and 3.0.0 are
      # all >= 2.4.20), so it subsumes the two rules above and holds whatever
      # Dependabot does when one dependency-name carries several ignore entries.
      # Kotlin patches BELOW 2.4.20 still flow.
      #
      # LIFT IT when the codeql-action bundle ships a Kotlin extractor that
      # accepts 2.4.20: read the version out of a recent Analyze (java-kotlin)
      # log rather than release notes, and raise build.gradle.kts in the same PR.
      #
      # KSP is NOT affected: com.google.devtools.ksp is on 2.3.12 and KSP2 is
      # versioned independently of Kotlin, so its patches do not drag a Kotlin
      # version in.
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [">=2.4.20"]
      - dependency-name: "org.jetbrains.kotlin.*"
        versions: [">=2.4.20"]
      - dependency-name: "org.jetbrains.kotlinx:*"
        update-types: ["version-update:semver-major"]
      # (The kotlinx-serialization-json ">=1.10.0" ceiling that lived here was
      # lifted with the Kotlin 2.4 move: its Kotlin/Native klibs are readable
      # again and :shared is on 1.11.0 like the app. The semver-major hold above
      # still applies.)
      - dependency-name: "com.google.devtools.ksp"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Hilt minor+ moves with the Kotlin toolchain (its shaded kotlin-metadata
      # reader is what decides which Kotlin class files hiltJavaCompile accepts:
      # 2.59.x stopped at 2.3, 2.60.1 reads 2.4). Bump together, never alone.
      - dependency-name: "com.google.dagger:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # The Hilt GRADLE PLUGIN id — see the plugin-id note above. The
      # "com.google.dagger:*" rule does not match it, which is why Hilt 2.60.1
      # reappeared as a fresh PR after being closed as blocked.
      - dependency-name: "com.google.dagger.hilt.android"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # AndroidX group bumps frequently require AGP minor+
      - dependency-name: "androidx.core:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "androidx.activity:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      androidx:
        patterns: ["androidx.*"]
      compose:
        patterns: ["androidx.compose*"]
      hilt:
        patterns: ["com.google.dagger*"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # codeql-action/init and codeql-action/analyze MUST run at the same
      # version: analyze refuses to consume a config written by a different
      # init, failing with "Loaded a configuration file for version 'X', but
      # running version 'Y'".
      #
      # Ungrouped, Dependabot raises one PR per sub-action, so each PR bumps
      # half of the pair and mismatches the other. NEITHER can go green, and no
      # amount of rebasing helps — that is exactly how #232 and #234 sat broken
      # and unmergeable while the advisory they carried stayed open. Grouping
      # them means one PR moves the whole pair atomically.
      codeql:
        patterns:
          - "github/codeql-action*"
