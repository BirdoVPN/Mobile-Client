name: Workflow lint

# Lints this repo's GitHub Actions workflows with actionlint (with shellcheck, which ships on ubuntu runners)
# and zizmor (security audit). Both are pinned to a version and verified by SHA-256, so the gate is the same
# on every run; bump them deliberately (versions + hashes together).
on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: zizmor
        env:
          # Online audits (impostor commits, known-vulnerable actions, ref/version mismatches) query the API.
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' 'zizmor==1.30.1 --hash=sha256:eee12266b793cb87ad4a7e3af2e72404f8a63e3de5eb099b80bf7b1cfd232a8e --hash=sha256:4a5ef2fa4fbd2984f794cfc2f95790bd03fa0bae801487ed550e044675874e60' \
            > "$RUNNER_TEMP/zizmor-requirements.txt"
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --only-binary=:all: \
            --target "$RUNNER_TEMP/zizmor" -r "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor/bin/zizmor" --persona regular --min-severity medium --format github .github
