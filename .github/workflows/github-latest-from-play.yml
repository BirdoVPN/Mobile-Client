# ============================================================================
# GitHub "Latest" follows Google Play's 100% production release
# ============================================================================
# Owner decision 2026-10-01: GitHub "Latest" for Android must ALWAYS be the
# newest build that is FULLY released, updated automatically, never by
# hand-flipping drafts. "Fully released" means Google Play's production track
# shows it as `completed` (100% rollout).
#
# Why Play decides, not the tag: the in-app update banner reads the newest
# published android-v* GitHub release (GET /updates/android/{v}). If GitHub
# moved to a build that Play has not yet rolled out to everyone, Play users
# would be nudged to an update their store does not offer yet.
#
# Read-only on Play: play_release.py in probe mode opens an edit, reads the
# tracks and DISCARDS the edit.
#
# On GitHub, .github/scripts/latest-follows-play.sh keeps Latest ON Play's 100%
# build, not merely "never behind it" (owner 2026-11-18, MR-2418): from
# 2026-11-11 to 2026-11-16 android-v1.4.38, 1.4.39 and 1.4.40 were each
# published by hand as a full release while Play had them at 10% (Play's 100%
# build stayed 1.4.37), and the old "Latest is newer; leaving it" branch kept
# them Latest (and in F-Droid and the update banner) for about 4.4 days
# (docs/RELEASE-LOG.md). Any full android-v*
# release ahead of Play's 100% build is now set back to a prerelease, Play's
# build is made Latest, and the run goes red so the deviation is seen. It also
# runs when a release is published or edited by hand (a person's or PAT's edit
# triggers workflows; this job's own GITHUB_TOKEN edits do not, so no loop).
# A release event runs the workflow file AT THE RELEASE'S TAG, so that trigger
# covers tags cut after this change; the 6-hourly run covers every tag.
#
# A release published with GITHUB_TOKEN does not trigger other workflows, so
# F-Droid's metadata update (fdroid.yml) is dispatched explicitly.
# ============================================================================
name: GitHub Latest follows Play

on:
  schedule:
    - cron: '17 */6 * * *'  # every 6 h, off the hour
  release:
    types: [published, released, edited]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-latest-from-play
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    name: Move GitHub Latest to Play's 100% build
    # The 6-hourly run happens only in this repository, never in a fork; a
    # release event counts only for an Android release.
    if: >-
      ${{ (github.event_name != 'schedule' || github.repository == 'BirdoVPN/Mobile-Client')
      && (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'android-v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # gh release edit / make_latest
      actions: write   # to dispatch fdroid.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install deps
        run: python3 -m pip install --user 'google-auth==2.40.3' 'requests==2.32.3'

      - name: Probe Play production (read-only)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: probe
          TRACK: production
        run: |
          set -euo pipefail
          python3 scripts/play_release.py | tee "$RUNNER_TEMP/out.txt"
          grep -q 'probe only' "$RUNNER_TEMP/out.txt" || { echo "::error::play_release.py probe did not complete"; exit 1; }

      - name: Keep GitHub Latest on the 100% production build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/latest-follows-play.sh "$RUNNER_TEMP/out.txt"
