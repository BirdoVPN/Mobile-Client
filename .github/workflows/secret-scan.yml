name: Secret Scan

# Continuous protection against accidental secret commits. The job name
# "Gitleaks" is a REQUIRED check on main: do not rename it, and do not add a
# workflow-level paths filter (a required check that never starts blocks the
# merge).
#
# WHAT EACH EVENT SCANS
#   pull_request (into ANY branch)  the PR's own commits: base..head. A commit
#                                   that is already on the base branch was
#                                   scanned when it got there, and a commit on
#                                   some OTHER branch is not this PR's business.
#   push to main                    main's full history.
#   schedule / workflow_dispatch    every branch and tag in the repository.
#                                   This repo is public, so a secret on ANY
#                                   branch is a leaked secret.
#
# Why PRs are scoped: gitleaks' default is `git log --all`, and with a full
# fetch that meant every pull request scanned every branch -- a fixture commit
# on overhaul/android turned every other PR red (Mobile #460).
#
# `edited`: retargeting a PR changes base..head, so the scan must run again.
# It runs on every edit (title/body too): skipping would post a SKIPPED
# Gitleaks, which counts as passing and would mask a red one, and the scan
# takes seconds.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC - every branch, full history
  workflow_dispatch:

permissions: {}

# The event is part of the group: the scheduled run and main pushes share a
# ref, and one would otherwise displace the other's pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks
    # The weekly sweep runs only in this repository, never in a fork.
    if: ${{ github.event_name != 'schedule' || github.repository == 'BirdoVPN/Mobile-Client' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scheduled scan reads every ref, and the
          # .gitleaksignore check below needs main to test ancestry.
          fetch-depth: 0
          persist-credentials: false

      # Use the Gitleaks CLI directly (no license required for any repo).
      # gitleaks-action requires a paid license for org-owned repos; the
      # CLI binary is fully open-source and works everywhere. Pinned by the
      # SHA-256 in upstream's gitleaks_8.21.2_checksums.txt.
      - name: Install Gitleaks CLI
        env:
          GL_VERSION: 8.21.2
          GL_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      # Fingerprints in .gitleaksignore are pinned to a commit sha, and this
      # repo squash-merges: a fingerprint added for a branch commit goes stale
      # the moment the PR lands, and this job then fails on MAIN rather than on
      # the PR that introduced it. Exemptions that have to keep matching belong
      # in .gitleaks.toml as path/regex allowlists, which are sha-independent.
      # Checked BEFORE the scan so the failure names the cause rather than
      # showing a re-fired finding on an unrelated commit.
      - name: Assert every .gitleaksignore fingerprint is already on main
        run: bash scripts/check_gitleaksignore.sh

      - name: Decide the scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              # Commits reachable from the PR head and not from its base:
              # exactly this PR's own commits, whatever branch it targets.
              git cat-file -e "${BASE_SHA}^{commit}"
              git cat-file -e "${HEAD_SHA}^{commit}"
              opts="${BASE_SHA}..${HEAD_SHA}"
              n=$(git rev-list --count "$opts")
              if [ "$n" -eq 0 ]; then
                echo "::error::the PR range $opts holds no commits -- refusing to report a scan of nothing as clean"
                exit 1
              fi
              echo "Scanning this PR's $n commit(s): $opts" ;;
            push)
              opts="HEAD"
              echo "Scanning main's full history ($(git rev-list --count HEAD) commits)" ;;
            *)
              opts="--all"
              echo "Scanning every ref ($(git rev-list --count --all) commits)" ;;
          esac
          echo "log_opts=$opts" >> "$GITHUB_OUTPUT"

      # --config is explicit rather than relying on gitleaks finding
      # ./.gitleaks.toml on its own: if that file is ever moved or renamed the
      # scan must fail loudly, not silently fall back to the default ruleset
      # and start reporting the committed PQ known-answer vectors as leaks.
      - name: Run Gitleaks scan
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          test -f .gitleaks.toml || { echo "::error::.gitleaks.toml is missing -- the PQ known-answer fixtures would be reported as leaks"; exit 1; }
          gitleaks detect \
            --source . \
            --log-opts="$LOG_OPTS" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: Upload SARIF report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          retention-days: 30
