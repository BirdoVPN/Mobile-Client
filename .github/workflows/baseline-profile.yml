# Regenerate the shipped baseline profile by RUNNING the app.
#
# WHY THIS WORKFLOW EXISTS (issue #358)
#
# A baseline profile is a recording of the classes and methods the app actually
# touches on cold start. Two earlier attempts committed a HAND-WRITTEN one. That
# is worse than shipping none: the platform AOT-compiles and pages in exactly
# what the profile lists, so a guess spends the startup budget on the wrong
# classes and makes launches slower, and no build check anywhere can see it. The
# only defence is that the file be produced by a machine that ran the app.
#
# It also has to keep being produced. A profile recorded once goes stale silently
# as the startup path moves -- a new library on the Application path, a changed
# first screen -- and a stale profile decays back towards the guess it replaced.
# Hence the monthly schedule, and hence this job FAILS on a materially different
# recording instead of quietly regenerating one.
#
# WHY A THRESHOLD AND NOT AN EXACT MATCH. Two back-to-back recordings on the same
# emulator are not identical: measured on this app, run 2 against run 1 was 28
# rules added, 9 removed, 22,687 unchanged -- 0.163% churn, all of it in
# timing-dependent background work (Sentry queue draining, a Compose paint
# helper). An exact-match gate would therefore fail every month, and a check that
# always fails is a check nobody reads. Only the same-machine figure is measured;
# host-to-host churn is NOT, so the threshold below is deliberately an order of
# magnitude looser. Its job is to catch a startup path that MOVED -- a new
# library on the Application path shifts tens of percent -- not to police noise.
#
# HARDWARE: this needs a full x86_64 emulator, so it needs KVM.
# GitHub's hosted ubuntu runners expose /dev/kvm, but only to the `kvm` group,
# which the runner user is not in by default -- hence the udev step below. That
# step is not decoration: without it the emulator falls back to software
# emulation and the boot times out. macOS runners are NOT an alternative here
# (no KVM, and HVF is unavailable on the hosted images); a self-hosted Linux box
# with /dev/kvm would work unchanged.
name: Baseline Profile

on:
  workflow_dispatch:
  schedule:
    # 04:20 UTC on the 3rd of each month. Off the hour and off the 1st, so it
    # does not pile onto the same runner minute as every other cron in the org.
    - cron: '20 4 3 * *'

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  generate:
    name: Record baseline profile on a managed device
    # The monthly run happens only in this repository, never in a fork.
    if: ${{ github.event_name != 'schedule' || github.repository == 'BirdoVPN/Mobile-Client' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # An emulator boot plus 12 recording iterations plus a nonMinifiedRelease
    # build. The default 360 minutes would let a hung emulator burn an entire
    # billing afternoon.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Hardware acceleration. Assert it rather than hope for it: a missing
      # /dev/kvm does not fail here, it fails 40 minutes later as an emulator
      # boot timeout that reads like flakiness.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable — this runner cannot host an emulator, so no profile can be recorded on it."; exit 1; }
          echo "/dev/kvm OK"

      # ── The app has to be the REAL app ────────────────────────────────────
      #
      # The profile is recorded from whatever actually runs, so the recording
      # build must carry the same native engines the shipped build does. An APK
      # with an empty jniLibs/ still installs and still launches, and would
      # produce a plausible-looking profile of an app that is missing its VPN
      # stack -- another silently-wrong profile, which is the whole failure mode
      # this workflow exists to avoid. Same native payload, built the same way,
      # as android-ci.yml's debug APK and android.yml's release
      # (.github/actions/android-native-libs). Nothing recorded here ships except
      # the profile text, which a human commits.
      - name: Restore the Go cache for the Xray engines
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: xray-go-${{ runner.os }}-${{ hashFiles('scripts/provision_xray_engines.sh') }}
          restore-keys: xray-go-${{ runner.os }}-

      - uses: ./.github/actions/android-native-libs

      # No signing secrets are needed: app/build.gradle.kts re-points the
      # nonMinifiedRelease/benchmarkRelease build types at the debug key
      # precisely so that recording a profile never depends on holding the
      # upload key.
      - name: Record the profile
        run: ./gradlew :app:generateReleaseBaselineProfile --no-daemon

      # THE ACTUAL ASSERTION. Everything above is setup.
      #
      # Read from HEAD rather than from the working tree, because the recording
      # has already overwritten the working-tree copy by this point -- comparing
      # the file against itself is the shape of check that passes forever.
      - name: Compare the fresh recording against the committed profile
        run: |
          set -euo pipefail
          profile=app/src/release/generated/baselineProfiles/baseline-prof.txt
          test -s "$profile" || {
            echo "::error::$profile is missing or empty after generation."
            exit 1
          }
          git show "HEAD:$profile" > "$RUNNER_TEMP/committed-prof.txt"
          python3 scripts/compare_baseline_profiles.py "$RUNNER_TEMP/committed-prof.txt" "$profile"

      # Uploaded even on failure -- when the profile HAS drifted, this artifact
      # is the fix, and re-running the whole 40-minute job to obtain it would be
      # absurd.
      - name: Upload the recorded profile
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/
          if-no-files-found: warn
          retention-days: 30
