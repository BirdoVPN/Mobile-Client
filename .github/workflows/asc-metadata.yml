name: ASC metadata

# App Store Connect metadata for the fields Apple's automated review rejects on,
# for BOTH platforms in one run.
#
# WHY THIS EXISTS
# ---------------
# Two rejection reasons keep recurring and neither is fixable from Xcode:
#
#   3.1.2  "offers auto-renewable subscriptions but does not include a functional
#           link to the Terms of Use (EULA) in the app metadata that appears on
#           the app's App Store product page"  -> App DESCRIPTION
#   2.1.0  "provide detailed responses to the following questions regarding the
#           app's VPN functionality ... and add this information to the App
#           Review Information section"        -> App Review Information NOTES
#
# Both live in App Store Connect, not in the build, and both must be set on the
# iOS app AND the macOS app separately. Doing it by hand across two platforms is
# how one of them ends up missing — which is exactly the state this repo was in.
#
# MODE=read makes no changes at all. Run it first: it prints what each platform
# currently has, so the apply run is made against observed state rather than an
# assumption about what a previous session did.
#
# The credentials are the ones ios.yml and macos.yml already use.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "read = print current state only. apply = write description + review notes."
        required: true
        default: read
        type: choice
        options: [read, apply, plan-attach, attach, inspect, resubmit-ios-plan, resubmit-ios-apply]
      platforms:
        description: "Which apps to act on"
        required: true
        default: both
        type: choice
        options: [both, ios, macos]

permissions:
  contents: read

jobs:
  metadata:
    name: ASC metadata (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet pyjwt cryptography requests

      - name: Report subscriptions and review submissions (read-only)
        if: inputs.mode == 'read'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: python .github/scripts/asc_metadata_subs.py

      - name: Inspect review submission items (read-only)
        if: inputs.mode == 'inspect'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: python .github/scripts/asc_inspect_items.py

      - name: Attach versions + subscriptions to review submissions
        if: inputs.mode == 'plan-attach' || inputs.mode == 'attach'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          MODE: ${{ inputs.mode == 'attach' && 'attach' || 'plan' }}
        run: python .github/scripts/asc_attach.py

      - name: Run
        if: inputs.mode == 'read' || inputs.mode == 'apply'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          MODE: ${{ inputs.mode }}
          PLATFORMS: ${{ inputs.platforms }}
        run: python .github/scripts/asc_metadata.py

      # After a rejection: bump the iOS version record to version.properties,
      # attach the processed build for it, mark the rejected review item
      # resolved, and re-submit any subscription the rejection released.
      # NEVER presses Submit. plan = print only.
      - name: Resubmit iOS (prepare only; never submits)
        if: startsWith(inputs.mode, 'resubmit-ios')
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          ASC_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          MODE: ${{ inputs.mode == 'resubmit-ios-apply' && 'apply' || 'plan' }}
        run: |
          set -euo pipefail
          . <(grep -E '^VERSION_(MAJOR|MINOR|PATCH)=' version.properties)
          export TARGET_VERSION="${VERSION_MAJOR}.${VERSION_MINOR}.${VERSION_PATCH}"
          export TARGET_BUILD="$(( VERSION_MAJOR * 10000 + VERSION_MINOR * 100 + VERSION_PATCH ))"
          echo "target ${TARGET_VERSION} (${TARGET_BUILD})"
          python .github/scripts/asc_resubmit_ios.py
