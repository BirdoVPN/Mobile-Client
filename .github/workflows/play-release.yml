name: Play Release Control

# Owner-invoked. android.yml's auto-submit was refused by Google with
# "Changes cannot be sent for review automatically" (the app has Console
# changes pending from the 10428 Broken Functionality rejection), and that
# workflow rightly refuses to force it on an automated release path.
#
# This is the manual path: halt a bad rollout, or land an AAB in the Console
# as a DRAFT. It never sends anything for review.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (read-only) | halt (stop the in-progress rollout) | promote (upload an AAB as a draft)"
        required: true
        default: probe
        type: choice
        options: [probe, halt, promote]
      track:
        description: "Play track"
        required: false
        default: production
      release_tag:
        description: "promote only: the GitHub release tag holding app-release.aab"
        required: false
        default: ""

permissions: {}

# promote opens a Play edit and commits it: one Play edit at a time, repo-wide
# (android.yml's upload and play-listing.yml apply hold the same lock). A group
# keeps one running and ONE pending run; a newer pending run cancels the older
# one, so a third writer displaces a queued second (it shows as cancelled and
# must be re-run -- it never runs concurrently).
#
# halt is the emergency brake and has a group of its own: it must never wait
# behind, or be displaced by, a queued upload. If it does overlap a running
# edit, Play commits one edit and rejects the other, loudly.
#
# probe only reads and discards its edit, so it takes no lock at all.
concurrency:
  group: ${{ inputs.mode == 'probe' && format('play-probe-{0}', github.run_id) || (inputs.mode == 'halt' && 'google-play-halt' || 'google-play-edit') }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  control:
    name: Play ${{ inputs.mode }} (${{ inputs.track }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install deps
        run: python3 -m pip install --user 'google-auth==2.40.3' 'requests==2.32.3'
      - name: Fetch the AAB
        if: ${{ inputs.mode == 'promote' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG" || { echo "::error::release_tag is required for promote"; exit 1; }
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^android-v[0-9A-Za-z._-]{1,56}$'; then
            echo "::error::release_tag must be an android-v* tag, got: $RELEASE_TAG"
            exit 1
          fi
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p 'app-release.aab' -D aab
          ls -la aab/
      - name: Run
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          MODE: ${{ inputs.mode }}
          TRACK: ${{ inputs.track }}
          AAB_PATH: aab/app-release.aab
        run: |
          set -euo pipefail
          python3 scripts/play_release.py | tee "$RUNNER_TEMP/out.txt"
          # A workflow whose steps were deleted still reports success. Assert the
          # script actually ran and reached its own end marker.
          # probe discards its edit and returns before any AFTER block, so it
          # has its own end marker. Accepting only 'AFTER:' made every probe
          # report failure on a run that did exactly what it should.
          grep -qE 'AFTER:|probe only' "$RUNNER_TEMP/out.txt"             || { echo "::error::play_release.py reached no end marker - it did not run to completion"; exit 1; }
