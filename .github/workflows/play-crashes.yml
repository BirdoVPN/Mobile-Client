name: Play Crashes

# Read-only. Asks the Play Developer Reporting API for real stack traces
# instead of inferring a crash from the changelog - which is how the last
# Android crash hunt reached a wrong answer.
on:
  workflow_dispatch:
    inputs:
      version_codes:
        description: "Comma-separated versionCodes (e.g. 10428,10429)"
        required: false
        default: "10428"
      days:
        description: "Look-back window in days"
        required: false
        default: "28"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  crashes:
    name: Play crashes (${{ inputs.version_codes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install deps
        run: python3 -m pip install --user 'google-auth==2.40.3' 'requests==2.32.3'
      - name: Fetch crash issues and stack traces
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODES: ${{ inputs.version_codes }}
          DAYS: ${{ inputs.days }}
        run: |
          set -euo pipefail
          python3 scripts/play_crashes.py | tee "$RUNNER_TEMP/out.txt"
          grep -qE 'crash issue|returned no crash issues|COULD NOT READ' "$RUNNER_TEMP/out.txt" \
            || { echo "::error::play_crashes.py produced no verdict - it did not run to completion"; exit 1; }
