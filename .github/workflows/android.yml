name: Mobile CI (Android + iOS)

on:
  push:
    branches: [main, develop]
    tags:
      - 'android-v*'   # e.g. android-v1.2.0 - triggers release + Play Store upload
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for the draft release (e.g. android-v0.1.0). If empty, uses run id.'
        required: false
        default: ''
      play_track:
        description: 'Google Play track (only used when PLAY_UPLOAD_ENABLED=true)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

# FIX CI: Minimum permissions by default
permissions:
  contents: read

# -- Azure Key Vault (release signing) ------------------------------------------
# The release and release-aab jobs retrieve the Android signing keystore from
# Azure Key Vault using OIDC federation - no stored credentials in GitHub secrets.
#
# Required GitHub repository SECRETS:
#   AZURE_TENANT_ID   - Azure Active Directory tenant ID
#   AZURE_CLIENT_ID   - App registration (service principal) client ID
#
# Required GitHub repository VARIABLES (Settings -> Secrets and variables -> Variables):
#   AZURE_KEY_VAULT_NAME  - Key Vault name, e.g. "birdovpn-keyvault"
#
# Required Azure Key Vault secrets (create in Azure Portal or via az CLI):
#   android-keystore-base64   - base64-encoded release .jks keystore
#   android-store-password    - keystore password
#   android-key-alias         - signing key alias
#   android-key-password      - signing key password
#
# OIDC federated credential (add under App Registration -> Certificates & secrets ->
# Federated credentials with issuer https://token.actions.githubusercontent.com):
#   Subject for main-branch builds:  repo:<org>/<repo>:ref:refs/heads/main
#   Subject for tag-triggered builds: repo:<org>/<repo>:ref:refs/tags/*
#
# Role assignment: grant the app "Key Vault Secrets User" on the Key Vault resource.
# -------------------------------------------------------------------------------

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  XRAY_VERSION: v26.2.6
  XRAY_ANDROID_ARM64_SHA256: 952ccbb2275eace52e644a349358de293278eefc32b139d795b067edcb6a2f07
  XRAY_ANDROID_AMD64_SHA256: f11f5bb71ebb2fe4127670404fbd0c21d93f62e453870fda65ad6effe7a6131e

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check certificate pin expiry
        run: |
          # Extract pin-set expiration date from network_security_config.xml
          EXPIRY=$(grep -oP 'expiration="\K[^"]+' app/src/main/res/xml/network_security_config.xml)
          if [ -z "$EXPIRY" ]; then
            echo "::error::No pin-set expiration found in network_security_config.xml"
            exit 1
          fi
          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
          echo "Certificate pins expire: $EXPIRY ($DAYS_LEFT days remaining)"
          if [ "$DAYS_LEFT" -lt 0 ]; then
            echo "::error::Certificate pins EXPIRED on $EXPIRY! App will fail to connect."
            exit 1
          elif [ "$DAYS_LEFT" -lt 60 ]; then
            echo "::warning::Certificate pins expire in $DAYS_LEFT days ($EXPIRY). Rotate pins NOW!"
          elif [ "$DAYS_LEFT" -lt 90 ]; then
            echo "::warning::Certificate pins expire in $DAYS_LEFT days ($EXPIRY). Plan pin rotation soon."
          else
            echo "Pin expiry OK: $DAYS_LEFT days remaining"
          fi

      - name: Run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

  codeql-java-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-codeql-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-codeql-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Android for CodeQL
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :shared:compileDebugKotlinAndroid \
            -Pkotlin.native.ignoreDisabledTargets=true \
            --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          category: '/language:java-kotlin'

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Rust Android toolchain
        run: |
          # armv7-linux-androideabi is needed so cargo-ndk can cross-compile
          # the rosenpass-jni crate for armeabi-v7a (native/build.sh). NOTE:
          # armeabi-v7a is NOT a shipped ABI — app/build.gradle.kts abiFilters
          # restricts the packaged APK/AAB to arm64-v8a + x86_64 because the
          # Xray Reality engine is only downloaded for those two ABIs below.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - name: Download pinned Xray Reality engines
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 "$RUNNER_TEMP/xray-arm64" "$RUNNER_TEMP/xray-amd64"

          curl -fsSL -o "$RUNNER_TEMP/xray-arm64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          echo "${XRAY_ANDROID_ARM64_SHA256}  $RUNNER_TEMP/xray-arm64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-arm64.zip" -d "$RUNNER_TEMP/xray-arm64"
          cp "$(find "$RUNNER_TEMP/xray-arm64" -type f -name xray | head -n1)" app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fsSL -o "$RUNNER_TEMP/xray-amd64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-amd64.zip"
          echo "${XRAY_ANDROID_AMD64_SHA256}  $RUNNER_TEMP/xray-amd64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-amd64.zip" -d "$RUNNER_TEMP/xray-amd64"
          cp "$(find "$RUNNER_TEMP/xray-amd64" -type f -name xray | head -n1)" app/src/main/jniLibs/x86_64/libxray.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so app/src/main/jniLibs/x86_64/libxray.so

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Skip when Azure Key Vault is not configured (forks, dependabot PRs, contributors).
    if: ${{ vars.AZURE_KEY_VAULT_NAME != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch') }}
    # Azure OIDC setup (keystore retrieved from Azure Key Vault - no GitHub secrets needed):
    #   Secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID
    #   Variables: AZURE_KEY_VAULT_NAME  (e.g. "birdovpn-keyvault")
    # Key Vault secrets required (names are case-sensitive):
    #   android-keystore-base64   - base64-encoded release keystore (.jks)
    #   android-store-password    - keystore password
    #   android-key-alias         - signing key alias inside the keystore
    #   android-key-password      - signing key password
    #   android-signing-cert-fingerprint - optional SHA-256 fingerprint allow-list override
    # OIDC federated credential subject (add in Azure App Registration):
    #   repo:<org>/<repo>:ref:refs/heads/main
    #   repo:<org>/<repo>:ref:refs/tags/*
    permissions:
      contents: read
      id-token: write  # Required for both Sigstore (Fulcio OIDC) and Azure AD OIDC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Rust Android toolchain
        run: |
          # armv7-linux-androideabi is needed so cargo-ndk can cross-compile
          # the rosenpass-jni crate for armeabi-v7a (native/build.sh). NOTE:
          # armeabi-v7a is NOT a shipped ABI — app/build.gradle.kts abiFilters
          # restricts the packaged APK/AAB to arm64-v8a + x86_64 because the
          # Xray Reality engine is only downloaded for those two ABIs below.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - name: Download pinned Xray Reality engines
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 "$RUNNER_TEMP/xray-arm64" "$RUNNER_TEMP/xray-amd64"

          curl -fsSL -o "$RUNNER_TEMP/xray-arm64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          echo "${XRAY_ANDROID_ARM64_SHA256}  $RUNNER_TEMP/xray-arm64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-arm64.zip" -d "$RUNNER_TEMP/xray-arm64"
          cp "$(find "$RUNNER_TEMP/xray-arm64" -type f -name xray | head -n1)" app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fsSL -o "$RUNNER_TEMP/xray-amd64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-amd64.zip"
          echo "${XRAY_ANDROID_AMD64_SHA256}  $RUNNER_TEMP/xray-amd64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-amd64.zip" -d "$RUNNER_TEMP/xray-amd64"
          cp "$(find "$RUNNER_TEMP/xray-amd64" -type f -name xray | head -n1)" app/src/main/jniLibs/x86_64/libxray.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so app/src/main/jniLibs/x86_64/libxray.so

      # Log in to Azure using OIDC - no stored client secrets required.
      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      # Retrieve encrypted keystore + signing credentials from Azure Key Vault.
      # SEC: All secrets are masked with ::add-mask:: so they never appear in logs.
      # The keystore file is written to $RUNNER_TEMP (not the workspace) to prevent
      # accidental artifact upload or caching.
      - name: Retrieve Android keystore from Azure Key Vault
        env:
          SIGNING_CERT_FINGERPRINT_VAR: ${{ vars.BIRDO_SIGNING_CERT_FINGERPRINT }}
          SIGNING_CERT_FINGERPRINT_SECRET: ${{ secrets.BIRDO_SIGNING_CERT_FINGERPRINT }}
        run: |
          KS_B64=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-keystore-base64" \
            --query value --output tsv)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/birdo-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/birdo-release.jks" >> "$GITHUB_ENV"

          STORE_PASS=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-store-password" \
            --query value --output tsv)
          echo "::add-mask::$STORE_PASS"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"

          KEY_ALIAS=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-key-alias" \
            --query value --output tsv)
          echo "::add-mask::$KEY_ALIAS"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          KEY_PASS=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-key-password" \
            --query value --output tsv)
          echo "::add-mask::$KEY_PASS"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          SIGNING_FP=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-signing-cert-fingerprint" \
            --query value --output tsv 2>/dev/null || true)
          if [ -z "$SIGNING_FP" ]; then SIGNING_FP="$SIGNING_CERT_FINGERPRINT_SECRET"; fi
          if [ -z "$SIGNING_FP" ]; then SIGNING_FP="$SIGNING_CERT_FINGERPRINT_VAR"; fi
          if [ -z "$SIGNING_FP" ]; then
            SIGNING_FP=$(keytool -list -v \
              -keystore "$RUNNER_TEMP/birdo-release.jks" \
              -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" \
              | awk -F': ' '/SHA256:/{print $2; exit}')
          fi
          if [ -z "$SIGNING_FP" ]; then
            echo "::error::Could not resolve Android signing certificate fingerprint"
            exit 1
          fi
          echo "::add-mask::$SIGNING_FP"
          echo "BIRDO_SIGNING_CERT_FINGERPRINT=$SIGNING_FP" >> "$GITHUB_ENV"

      - name: Build Release APK and AAB
        # RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
        # are set as GITHUB_ENV by the Azure Key Vault step above.
        #
        # Two distribution targets from one source tree:
        #   • APK  (assembleRelease, default IS_PLAY_BUILD=false) → GitHub release,
        #     direct/sideload install. Keeps the web-billing links; not bound by
        #     Google Play's Payments policy.
        #   • AAB  (bundleRelease -PplayBuild=true, IS_PLAY_BUILD=true) → Play
        #     Console. Strips all external-purchase steering to comply with the
        #     Play Payments policy.
        run: |
          chmod +x ./gradlew
          ./gradlew :app:buildRustLibs
          ./gradlew assembleRelease
          ./gradlew bundleRelease -PplayBuild=true

      # Google Play requires 16 KB page-size support for apps targeting API 35+.
      # Assert every shipped native .so has 16 KB-aligned LOAD segments BEFORE we
      # sign/upload — a non-aligned lib is rejected by the Play Console. We check
      # the libs INSIDE the built AAB (base/lib/**), so this covers not just our
      # own libs (xray, rosenpass-jni) but every .so merged in from AAR
      # dependencies (wg-go, Sentry, glance, datastore) — the ones the source
      # jniLibs dir does not contain.
      - name: Verify 16 KB native library alignment
        run: |
          chmod +x scripts/check_16kb_alignment.sh
          rm -rf "$RUNNER_TEMP/aab-libs"
          unzip -q -o app/build/outputs/bundle/release/*.aab 'base/lib/*' -d "$RUNNER_TEMP/aab-libs"
          scripts/check_16kb_alignment.sh "$RUNNER_TEMP/aab-libs/base/lib"

      - name: Verify release APK payload
        run: python3 scripts/verify_android_release_apk.py app/build/outputs/apk/release/app-release.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/birdo-release.jks"

      # -- Sigstore keyless signing --------------------------------------
      # Signs the APK/AAB with cosign using GitHub OIDC identity.
      # Produces a .sigstore bundle for each artifact so anyone can verify
      # the Android artifacts were built by this repo's GitHub Actions.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release APK and AAB with Sigstore
        run: |
          for artifact in app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore" "$artifact"
            echo "Signed $(basename $artifact) -> $(basename $artifact).sigstore"
          done

      - name: Generate SHA256 checksums
        run: |
          mkdir -p app/build/release-artifacts
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab \
            | sed 's#app/build/outputs/apk/release/##;s#app/build/outputs/bundle/release/##' \
            > app/build/release-artifacts/SHA256SUMS.txt
          cat app/build/release-artifacts/SHA256SUMS.txt

      - name: Sign checksums with Sigstore
        run: |
          cosign sign-blob --yes --bundle "app/build/release-artifacts/SHA256SUMS.txt.sigstore" "app/build/release-artifacts/SHA256SUMS.txt"

      # -- GPG detached signing (.asc) for sideload APK -----------------
      # Parity with desktop Linux pipeline so users can verify a sideloaded
      # APK using only `gpg --verify file.asc file` against the public key
      # published at https://birdo.app/.well-known/birdo-release.asc.
      # Required GitHub repository SECRETS:
      #   ANDROID_GPG_PRIVATE_KEY  - ASCII-armoured private key block
      #   ANDROID_GPG_PASSPHRASE   - passphrase for the private key
      #   ANDROID_GPG_KEY_ID       - long key ID (e.g. ABCDEF0123456789)
      - name: Detect GPG availability
        id: gpg-detect
        env:
          GPG_KEY: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          GPG_KID: ${{ secrets.ANDROID_GPG_KEY_ID }}
        run: |
          if [ -n "$GPG_KEY" ] && [ -n "$GPG_KID" ]; then
            echo "HAS_GPG=true"  >> "$GITHUB_ENV"
          else
            echo "HAS_GPG=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_GPG_PRIVATE_KEY / ANDROID_GPG_KEY_ID not configured - skipping GPG signing"
          fi

      - name: Import GPG signing key
        if: ${{ env.HAS_GPG == 'true' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          passphrase:      ${{ secrets.ANDROID_GPG_PASSPHRASE }}

      - name: GPG-sign release APK and AAB (detached .asc)
        if: ${{ env.HAS_GPG == 'true' }}
        run: |
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${{ secrets.ANDROID_GPG_PASSPHRASE }}" \
                --local-user "${{ secrets.ANDROID_GPG_KEY_ID }}" \
                --armor --detach-sign --output "${apk}.asc" "$apk"
            echo "GPG-signed $(basename $apk) -> $(basename $apk).asc"
          done

      - name: GPG-sign SHA256SUMS (detached .asc)
        if: ${{ env.HAS_GPG == 'true' }}
        run: |
          SUMS="app/build/release-artifacts/SHA256SUMS.txt"
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.ANDROID_GPG_PASSPHRASE }}" \
              --local-user "${{ secrets.ANDROID_GPG_KEY_ID }}" \
              --armor --detach-sign --output "${SUMS}.asc" "$SUMS"

      - name: Collect release artifacts
        run: |
          shopt -s nullglob
          for artifact in \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/*.sigstore \
            app/build/outputs/apk/release/*.asc \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/bundle/release/*.sigstore \
            app/build/outputs/bundle/release/*.asc; do
            cp "$artifact" app/build/release-artifacts/
          done
          ls -la app/build/release-artifacts

      - name: Upload Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: |
            app/build/release-artifacts/*

      - name: Upload Mapping File
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping
          path: app/build/outputs/mapping/release/mapping.txt

  # -- GitHub Draft Release (sideload APK for phone install) ----------
  # Publishes the signed release APK + sigstore bundle + GPG .asc + checksums
  # to a *draft* GitHub Release. Open the draft on github.com (or the GitHub
  # Mobile app) and tap the APK asset to install on your Android device.
  #
  # Triggers on:
  #   - any push of a tag matching android-v*
  #   - manual workflow_dispatch (uses inputs.release_tag, falling back to run id)
  draft-release:
    name: Publish Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download release APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apk
          path: release-apk/

      - name: List artifacts
        run: ls -la release-apk/

      - name: Determine release tag
        id: tag
        # PFA-CI: pass user input via env (NOT direct ${{ }} expansion in
        # `run:` body — that would be a script-injection sink). Then enforce
        # a strict tag regex before letting it touch any downstream tool.
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              # Allowlist: alnum, dot, dash, underscore, max 64 chars.
              # Rejects shell metachars ($, `, ;, |, &, <, >, quotes, newline).
              if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
                echo "::error::release_tag input failed validation: $INPUT_TAG"
                echo "::error::Must match ^[A-Za-z0-9._-]{1,64}$"
                exit 1
              fi
              TAG="$INPUT_TAG"
            else
              TAG="android-dispatch-${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF##*/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create / update draft GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2.4.0
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Birdo Android ${{ steps.tag.outputs.tag }}"
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
          fail_on_unmatched_files: false
          body: |
            ## Birdo VPN - Android sideload build

            **Build:** `${{ steps.tag.outputs.tag }}`
            **Commit:** `${{ github.sha }}`

            ### Install
            Download the `.apk` asset below on your Android device and tap it to install.
            The `.aab` asset is the Play Console upload artifact.
            You may need to enable **Install unknown apps** for your browser / file manager.

            ### Verify (optional)
            - Sigstore: `cosign verify-blob --bundle <apk>.sigstore <apk>`
            - GPG:      `gpg --verify <apk>.asc <apk>`  (key: https://birdo.app/.well-known/birdo-release.asc)
            - SHA256:   `sha256sum -c SHA256SUMS.txt`

            > This is a **draft** release - not visible to the public until you click "Publish".
          files: |
            release-apk/*.apk
            release-apk/*.apk.sigstore
            release-apk/*.apk.asc
            release-apk/*.aab
            release-apk/*.aab.sigstore
            release-apk/*.aab.asc
            release-apk/SHA256SUMS.txt
            release-apk/SHA256SUMS.txt.sigstore
            release-apk/SHA256SUMS.txt.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  play-upload:
    name: Upload AAB to Google Play
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ vars.PLAY_UPLOAD_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-apk
          path: release-apk/
      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5 (node24)
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.birdo.vpn
          releaseFiles: release-apk/*.aab
          track: ${{ github.event.inputs.play_track || 'internal' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          # The Play API refuses to auto-submit the edit for review for this app
          # ("Changes cannot be sent for review automatically"); committing the
          # edit without auto-review lets the AAB upload succeed (it lands on the
          # track) — submit it for review from the Play Console UI.
          changesNotSentForReview: true

