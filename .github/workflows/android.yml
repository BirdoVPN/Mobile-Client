name: Mobile CI (Android + iOS)

on:
  push:
    branches: [main, develop]
    tags:
      - 'android-v*'   # e.g. android-v1.2.0 - triggers release + Play Store upload
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag name for the draft release (e.g. android-v0.1.0). If empty, uses run id.'
        required: false
        default: ''
      play_track:
        description: 'Google Play track (only used when PLAY_UPLOAD_ENABLED=true)'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

# FIX CI: Minimum permissions by default
permissions:
  contents: read

# -- Azure Key Vault (release signing) ------------------------------------------
# The release and release-aab jobs retrieve the Android signing keystore from
# Azure Key Vault using OIDC federation - no stored credentials in GitHub secrets.
#
# Required GitHub repository SECRETS:
#   AZURE_TENANT_ID   - Azure Active Directory tenant ID
#   AZURE_CLIENT_ID   - App registration (service principal) client ID
#
# Required GitHub repository VARIABLES (Settings -> Secrets and variables -> Variables):
#   AZURE_KEY_VAULT_NAME  - Key Vault name, e.g. "birdovpn-keyvault"
#
# Required Azure Key Vault secrets (create in Azure Portal or via az CLI):
#   android-keystore-base64   - base64-encoded release .jks keystore
#   android-store-password    - keystore password
#   android-key-alias         - signing key alias
#   android-key-password      - signing key password
#
# OIDC federated credential (add under App Registration -> Certificates & secrets ->
# Federated credentials with issuer https://token.actions.githubusercontent.com):
#   Subject for main-branch builds:  repo:<org>/<repo>:ref:refs/heads/main
#   Subject for tag-triggered builds: repo:<org>/<repo>:ref:refs/tags/*
#
# Role assignment: grant the app "Key Vault Secrets User" on the Key Vault resource.
# -------------------------------------------------------------------------------

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'
  XRAY_VERSION: v26.2.6
  XRAY_ANDROID_ARM64_SHA256: 952ccbb2275eace52e644a349358de293278eefc32b139d795b067edcb6a2f07
  XRAY_ANDROID_AMD64_SHA256: f11f5bb71ebb2fe4127670404fbd0c21d93f62e453870fda65ad6effe7a6131e

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Check certificate pin expiry
        run: |
          # Extract pin-set expiration date from network_security_config.xml
          EXPIRY=$(grep -oP 'expiration="\K[^"]+' app/src/main/res/xml/network_security_config.xml)
          if [ -z "$EXPIRY" ]; then
            echo "::error::No pin-set expiration found in network_security_config.xml"
            exit 1
          fi
          EXPIRY_EPOCH=$(date -d "$EXPIRY" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRY_EPOCH - NOW_EPOCH) / 86400 ))
          echo "Certificate pins expire: $EXPIRY ($DAYS_LEFT days remaining)"
          if [ "$DAYS_LEFT" -lt 0 ]; then
            echo "::error::Certificate pins EXPIRED on $EXPIRY! App will fail to connect."
            exit 1
          elif [ "$DAYS_LEFT" -lt 60 ]; then
            echo "::warning::Certificate pins expire in $DAYS_LEFT days ($EXPIRY). Rotate pins NOW!"
          elif [ "$DAYS_LEFT" -lt 90 ]; then
            echo "::warning::Certificate pins expire in $DAYS_LEFT days ($EXPIRY). Plan pin rotation soon."
          else
            echo "Pin expiry OK: $DAYS_LEFT days remaining"
          fi

      - name: Run Lint
        run: |
          chmod +x ./gradlew
          ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Run Unit Tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest/

  codeql-java-kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-codeql-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-codeql-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build Android for CodeQL
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileDebugKotlin :shared:compileDebugKotlinAndroid \
            -Pkotlin.native.ignoreDisabledTargets=true \
            --no-daemon

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:java-kotlin'

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Rust Android toolchain
        run: |
          # armv7-linux-androideabi is needed so cargo-ndk can cross-compile
          # the rosenpass-jni crate for armeabi-v7a (native/build.sh). NOTE:
          # armeabi-v7a is NOT a shipped ABI — app/build.gradle.kts abiFilters
          # restricts the packaged APK/AAB to arm64-v8a + x86_64 because the
          # Xray Reality engine is only downloaded for those two ABIs below.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - name: Download pinned Xray Reality engines
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 "$RUNNER_TEMP/xray-arm64" "$RUNNER_TEMP/xray-amd64"

          curl -fsSL -o "$RUNNER_TEMP/xray-arm64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          echo "${XRAY_ANDROID_ARM64_SHA256}  $RUNNER_TEMP/xray-arm64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-arm64.zip" -d "$RUNNER_TEMP/xray-arm64"
          cp "$(find "$RUNNER_TEMP/xray-arm64" -type f -name xray | head -n1)" app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fsSL -o "$RUNNER_TEMP/xray-amd64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-amd64.zip"
          echo "${XRAY_ANDROID_AMD64_SHA256}  $RUNNER_TEMP/xray-amd64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-amd64.zip" -d "$RUNNER_TEMP/xray-amd64"
          cp "$(find "$RUNNER_TEMP/xray-amd64" -type f -name xray | head -n1)" app/src/main/jniLibs/x86_64/libxray.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so app/src/main/jniLibs/x86_64/libxray.so

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # -- R8 on the pull-request path -----------------------------------
      #
      # Until this step existed, R8 NEVER RAN ON A PULL REQUEST. This job builds
      # only assembleDebug, and the `release` job below is gated on
      # `github.ref == refs/heads/main`, a tag, or workflow_dispatch -- which a
      # pull_request event never satisfies. Every change to
      # app/proguard-rules.pro therefore merged green without the shrinker
      # having looked at it once, and the first minified build was the release.
      #
      # We run the R8 TASK, not assembleRelease: packageRelease needs the Azure
      # keystore, which a fork or dependabot PR does not have, whereas
      # minifyReleaseWithR8 produces the shrunk DEX plus
      # mapping/seeds/usage/configuration with no signing material at all. The
      # two -P flags exist only to get past validateReleaseSecurityConfig and
      # validateSentryDsn; nothing is packaged, so neither value ships.
      - name: Run R8 (minified release) - proves shrinker changes on the PR
        run: |
          ./gradlew :app:minifyReleaseWithR8 \
            -PbirdoSigningCertFingerprint=00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00 \
            -PallowMissingSentryDsn=true

      # Asserts against the shrunk DEX that R8 did not silently delete the
      # WireGuard/Rosenpass JNI bindings or a kotlinx.serialization serializer.
      # Both break only at runtime, on a user's device, with no logcat --
      # -assumenosideeffects strips every Log.* call from release builds -- so
      # this is the only place they can be caught.
      #
      # Demonstrated, not assumed: deleting the GoBackend keep produces a build
      # that SUCCEEDS and a DEX with wgTurnOn, wgGetSocketV4 and wgGetSocketV6
      # gone. This step returns 1 on that build.
      - name: Verify R8 keeps
        run: python3 scripts/check_r8_keeps.py

      # Asserts the baked NATIVE_HASH_* constants equal the SHA-256 of the .so
      # files that actually ship, so NativeLibraryVerifier can match them on a
      # device instead of silently degrading to the signature-only check.
      #
      # Two disarmed-but-green releases motivated this. The constants were first
      # written through `android.defaultConfig.buildConfigField` from a task
      # doFirst and shipped as "" for every release; then they were computed from
      # merge<Variant>NativeLibs, which is the wrong stage -- AGP's
      # strip<Variant>DebugSymbols runs afterwards and is what packaging copies
      # into the APK. Measured with NDK 29.0.13846066, librosenpass_jni.so goes
      # 469480 -> 325280 bytes across that step and libxray.so changes hash at
      # the same size, so two of the three engines could never match.
      #
      # Neither failure was visible in a build log: the build succeeded both
      # times. This step is the only thing that looks at the values themselves.
      #
      # :app:generateReleaseBuildConfig depends on :app:stripReleaseDebugSymbols
      # (app/build.gradle.kts), and minifyReleaseWithR8 above needs BuildConfig,
      # so both artifacts this script reads already exist by now -- it needs no
      # signing material and no extra Gradle invocation.
      - name: Verify native integrity hashes match the shipped .so files
        run: python3 scripts/check_native_hashes.py

      # seeds.txt / usage.txt / configuration.txt are written by AGP next to
      # mapping.txt on every minified build, with no extra ProGuard directives
      # needed. They are how the next person measures a rule change instead of
      # guessing: configuration.txt is the fully merged rule set naming the
      # source file of every rule, seeds.txt is everything R8 was forbidden to
      # touch, usage.txt is everything it removed.
      - name: Upload R8 reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: r8-reports-pr
          path: app/build/outputs/mapping/release/

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Skip when Azure Key Vault is not configured (forks, dependabot PRs, contributors).
    if: ${{ vars.AZURE_KEY_VAULT_NAME != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch') }}
    # Azure OIDC setup (keystore retrieved from Azure Key Vault - no GitHub secrets needed):
    #   Secrets:   AZURE_TENANT_ID, AZURE_CLIENT_ID
    #   Variables: AZURE_KEY_VAULT_NAME  (e.g. "birdovpn-keyvault")
    # Key Vault secrets required (names are case-sensitive):
    #   android-keystore-base64   - base64-encoded release keystore (.jks)
    #   android-store-password    - keystore password
    #   android-key-alias         - signing key alias inside the keystore
    #   android-key-password      - signing key password
    #   android-signing-cert-fingerprint - optional SHA-256 fingerprint allow-list override
    # OIDC federated credential subject (add in Azure App Registration):
    #   repo:<org>/<repo>:ref:refs/heads/main
    #   repo:<org>/<repo>:ref:refs/tags/*
    permissions:
      contents: read
      id-token: write  # Required for both Sigstore (Fulcio OIDC) and Azure AD OIDC
    # Declared at JOB level, not on the single build step, deliberately.
    # Issue #357: `SENTRY_DSN` was read by app/build.gradle.kts and supplied by
    # nothing, so every artifact this job has ever produced shipped an inert
    # crash reporter — green build, no signal. A step-level env: would put us
    # one added gradle step away from that state again; at job level every
    # gradle invocation in this job inherits it.
    #
    # This job is the ONLY place in the repo that builds a release Android
    # artifact (assembleRelease + bundleRelease, both below). fdroid.yml does
    # not build — it re-signs the app-release.apk this job published — and
    # ios.yml / macos.yml build the :shared KMP framework, which has no
    # BuildConfig and no Sentry dependency.
    #
    # The build FAILS if the secret is unset (:app:validateSentryDsn). That is
    # intentional: see docs/SENTRY-SETUP.md.
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Rust Android toolchain
        run: |
          # armv7-linux-androideabi is needed so cargo-ndk can cross-compile
          # the rosenpass-jni crate for armeabi-v7a (native/build.sh). NOTE:
          # armeabi-v7a is NOT a shipped ABI — app/build.gradle.kts abiFilters
          # restricts the packaged APK/AAB to arm64-v8a + x86_64 because the
          # Xray Reality engine is only downloaded for those two ABIs below.
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version 4.1.2

      - name: Download pinned Xray Reality engines
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64 "$RUNNER_TEMP/xray-arm64" "$RUNNER_TEMP/xray-amd64"

          curl -fsSL -o "$RUNNER_TEMP/xray-arm64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-arm64-v8a.zip"
          echo "${XRAY_ANDROID_ARM64_SHA256}  $RUNNER_TEMP/xray-arm64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-arm64.zip" -d "$RUNNER_TEMP/xray-arm64"
          cp "$(find "$RUNNER_TEMP/xray-arm64" -type f -name xray | head -n1)" app/src/main/jniLibs/arm64-v8a/libxray.so

          curl -fsSL -o "$RUNNER_TEMP/xray-amd64.zip" "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-android-amd64.zip"
          echo "${XRAY_ANDROID_AMD64_SHA256}  $RUNNER_TEMP/xray-amd64.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/xray-amd64.zip" -d "$RUNNER_TEMP/xray-amd64"
          cp "$(find "$RUNNER_TEMP/xray-amd64" -type f -name xray | head -n1)" app/src/main/jniLibs/x86_64/libxray.so

          chmod 755 app/src/main/jniLibs/arm64-v8a/libxray.so app/src/main/jniLibs/x86_64/libxray.so

      # Log in to Azure using OIDC - no stored client secrets required.
      - name: Azure Login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          allow-no-subscriptions: true

      # Retrieve encrypted keystore + signing credentials from Azure Key Vault.
      # SEC: All secrets are masked with ::add-mask:: so they never appear in logs.
      # The keystore file is written to $RUNNER_TEMP (not the workspace) to prevent
      # accidental artifact upload or caching.
      - name: Retrieve Android keystore from Azure Key Vault
        env:
          SIGNING_CERT_FINGERPRINT_VAR: ${{ vars.BIRDO_SIGNING_CERT_FINGERPRINT }}
          SIGNING_CERT_FINGERPRINT_SECRET: ${{ secrets.BIRDO_SIGNING_CERT_FINGERPRINT }}
        run: |
          KS_B64=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-keystore-base64" \
            --query value --output tsv)
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/birdo-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/birdo-release.jks" >> "$GITHUB_ENV"

          STORE_PASS=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-store-password" \
            --query value --output tsv)
          echo "::add-mask::$STORE_PASS"
          echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"

          KEY_ALIAS=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-key-alias" \
            --query value --output tsv)
          echo "::add-mask::$KEY_ALIAS"
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          KEY_PASS=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-key-password" \
            --query value --output tsv)
          echo "::add-mask::$KEY_PASS"
          echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

          SIGNING_FP=$(az keyvault secret show \
            --vault-name "${{ vars.AZURE_KEY_VAULT_NAME }}" \
            --name "android-signing-cert-fingerprint" \
            --query value --output tsv 2>/dev/null || true)
          if [ -z "$SIGNING_FP" ]; then SIGNING_FP="$SIGNING_CERT_FINGERPRINT_SECRET"; fi
          if [ -z "$SIGNING_FP" ]; then SIGNING_FP="$SIGNING_CERT_FINGERPRINT_VAR"; fi
          if [ -z "$SIGNING_FP" ]; then
            SIGNING_FP=$(keytool -list -v \
              -keystore "$RUNNER_TEMP/birdo-release.jks" \
              -storepass "$STORE_PASS" \
              -alias "$KEY_ALIAS" \
              | awk -F': ' '/SHA256:/{print $2; exit}')
          fi
          if [ -z "$SIGNING_FP" ]; then
            echo "::error::Could not resolve Android signing certificate fingerprint"
            exit 1
          fi
          echo "::add-mask::$SIGNING_FP"
          echo "BIRDO_SIGNING_CERT_FINGERPRINT=$SIGNING_FP" >> "$GITHUB_ENV"

      - name: Build Release APK and AAB
        # RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
        # are set as GITHUB_ENV by the Azure Key Vault step above.
        #
        # SENTRY_DSN comes from the job-level env: above (repo secret). Both
        # gradle invocations below refuse to run without it.
        #
        # Two distribution targets from one source tree:
        #   • APK  (assembleRelease, default IS_PLAY_BUILD=false) → GitHub release,
        #     direct/sideload install. Keeps the web-billing links; not bound by
        #     Google Play's Payments policy.
        #   • AAB  (bundleRelease -PplayBuild=true, IS_PLAY_BUILD=true) → Play
        #     Console. Strips all external-purchase steering to comply with the
        #     Play Payments policy.
        run: |
          chmod +x ./gradlew
          ./gradlew :app:buildRustLibs
          ./gradlew assembleRelease
          # -PplayBuild flips BuildConfig.IS_PLAY_BUILD, so the bundle is a
          # SECOND, DIFFERENT R8 run: different constant folding, different
          # reachability, and it overwrites mapping/ in place. Keep the APK's
          # mapping before it is clobbered, or the APK can never be checked or
          # symbolicated against the build that produced it.
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/mapping-apk.txt"
          ./gradlew bundleRelease -PplayBuild=true

      # Google Play requires 16 KB page-size support for apps targeting API 35+.
      # Assert every shipped native .so has 16 KB-aligned LOAD segments BEFORE we
      # sign/upload — a non-aligned lib is rejected by the Play Console. We check
      # the libs INSIDE the built AAB (base/lib/**), so this covers not just our
      # own libs (xray, rosenpass-jni) but every .so merged in from AAR
      # dependencies (wg-go, Sentry, glance, datastore) — the ones the source
      # jniLibs dir does not contain.
      - name: Verify 16 KB native library alignment
        run: |
          chmod +x scripts/check_16kb_alignment.sh
          rm -rf "$RUNNER_TEMP/aab-libs"
          unzip -q -o app/build/outputs/bundle/release/*.aab 'base/lib/*' -d "$RUNNER_TEMP/aab-libs"
          scripts/check_16kb_alignment.sh "$RUNNER_TEMP/aab-libs/base/lib"

      # A SIGILL crash shipped in 1.4.25: pqcrypto-mlkem's default `neon` feature
      # compiles PQClean's AArch64 ML-KEM, which reaches 64 ARMv8.2 SHA3-extension
      # instructions with no runtime CPU check. FEAT_SHA3 is OPTIONAL, so on any
      # arm64 device without it the first `eor3` killed the process inside
      # nativeGenerateKeypair -- and with PQ default-ON, took the connection with
      # it. Reported from a Galaxy A70 (Snapdragon 675, ARMv8.2-A without
      # FEAT_SHA3). This asserts the opcodes are absent from what actually ships,
      # so re-enabling the feature fails the build instead of the user's phone.
      - name: Verify no SHA3-extension instructions in arm64 libraries
        run: |
          chmod +x scripts/check_no_sha3_ext.sh
          rm -rf "$RUNNER_TEMP/aab-libs-sha3"
          unzip -q -o app/build/outputs/bundle/release/*.aab 'base/lib/*' -d "$RUNNER_TEMP/aab-libs-sha3"
          scripts/check_no_sha3_ext.sh "$RUNNER_TEMP/aab-libs-sha3/base/lib"

      - name: Verify release APK payload
        run: python3 scripts/verify_android_release_apk.py app/build/outputs/apk/release/app-release.apk

      # The same assertions the PR path runs, but against the artifacts that are
      # about to be signed and shipped.
      #
      # BOTH artifacts, because this job ships two of them from two separate R8
      # runs. The AAB is the one with the users on it; checking only the
      # sideload APK would leave every Play install ungated. Each is checked
      # against ITS OWN mapping.txt -- the bundle build overwrote the shared
      # mapping/ output, and a cross-wired pair verifies nothing (the script
      # detects that case and fails rather than passing vacuously).
      - name: Verify R8 keeps (sideload APK)
        run: |
          python3 scripts/check_r8_keeps.py \
            app/build/outputs/apk/release/app-release.apk \
            --mapping "$RUNNER_TEMP/mapping-apk.txt"

      - name: Verify R8 keeps (Play AAB)
        run: |
          set -euo pipefail
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -n1)
          python3 scripts/check_r8_keeps.py "$AAB"

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/birdo-release.jks"

      # -- Sigstore keyless signing --------------------------------------
      # Signs the APK/AAB with cosign using GitHub OIDC identity.
      # Produces a .sigstore bundle for each artifact so anyone can verify
      # the Android artifacts were built by this repo's GitHub Actions.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release APK and AAB with Sigstore
        run: |
          for artifact in app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore" "$artifact"
            echo "Signed $(basename $artifact) -> $(basename $artifact).sigstore"
          done

      - name: Generate SHA256 checksums
        run: |
          mkdir -p app/build/release-artifacts
          sha256sum app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab \
            | sed 's#app/build/outputs/apk/release/##;s#app/build/outputs/bundle/release/##' \
            > app/build/release-artifacts/SHA256SUMS.txt
          cat app/build/release-artifacts/SHA256SUMS.txt

      - name: Sign checksums with Sigstore
        run: |
          cosign sign-blob --yes --bundle "app/build/release-artifacts/SHA256SUMS.txt.sigstore" "app/build/release-artifacts/SHA256SUMS.txt"

      # -- GPG detached signing (.asc) for sideload APK -----------------
      # Parity with desktop Linux pipeline so users can verify a sideloaded
      # APK using only `gpg --verify file.asc file` against the public key
      # published at https://birdo.app/.well-known/birdo-release.asc.
      # Required GitHub repository SECRETS:
      #   ANDROID_GPG_PRIVATE_KEY  - ASCII-armoured private key block
      #   ANDROID_GPG_PASSPHRASE   - passphrase for the private key
      #   ANDROID_GPG_KEY_ID       - long key ID (e.g. ABCDEF0123456789)
      - name: Detect GPG availability
        id: gpg-detect
        env:
          GPG_KEY: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          GPG_KID: ${{ secrets.ANDROID_GPG_KEY_ID }}
        run: |
          if [ -n "$GPG_KEY" ] && [ -n "$GPG_KID" ]; then
            echo "HAS_GPG=true"  >> "$GITHUB_ENV"
          else
            echo "HAS_GPG=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_GPG_PRIVATE_KEY / ANDROID_GPG_KEY_ID not configured - skipping GPG signing"
          fi

      - name: Import GPG signing key
        if: ${{ env.HAS_GPG == 'true' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.ANDROID_GPG_PRIVATE_KEY }}
          passphrase:      ${{ secrets.ANDROID_GPG_PASSPHRASE }}

      - name: GPG-sign release APK and AAB (detached .asc)
        if: ${{ env.HAS_GPG == 'true' }}
        run: |
          for apk in app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${{ secrets.ANDROID_GPG_PASSPHRASE }}" \
                --local-user "${{ secrets.ANDROID_GPG_KEY_ID }}" \
                --armor --detach-sign --output "${apk}.asc" "$apk"
            echo "GPG-signed $(basename $apk) -> $(basename $apk).asc"
          done

      - name: GPG-sign SHA256SUMS (detached .asc)
        if: ${{ env.HAS_GPG == 'true' }}
        run: |
          SUMS="app/build/release-artifacts/SHA256SUMS.txt"
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "${{ secrets.ANDROID_GPG_PASSPHRASE }}" \
              --local-user "${{ secrets.ANDROID_GPG_KEY_ID }}" \
              --armor --detach-sign --output "${SUMS}.asc" "$SUMS"

      - name: Collect release artifacts
        run: |
          shopt -s nullglob
          for artifact in \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/apk/release/*.sigstore \
            app/build/outputs/apk/release/*.asc \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/bundle/release/*.sigstore \
            app/build/outputs/bundle/release/*.asc; do
            cp "$artifact" app/build/release-artifacts/
          done
          ls -la app/build/release-artifacts

      - name: Upload Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-apk
          path: |
            app/build/release-artifacts/*

      # The whole directory, not just mapping.txt. AGP writes seeds.txt,
      # usage.txt, configuration.txt and resources.txt alongside it on every
      # minified build. Without them nobody can measure a shrinker change
      # against the release it shipped in: seeds.txt is what R8 was forbidden to
      # touch, usage.txt is what it removed, configuration.txt is the merged
      # rule set with per-rule provenance. mapping-apk.txt is the APK's own
      # mapping, kept before the bundle build overwrote mapping.txt.
      - name: Stage the APK mapping alongside the bundle's
        run: cp "$RUNNER_TEMP/mapping-apk.txt" app/build/outputs/mapping/release/mapping-apk.txt

      - name: Upload Mapping and R8 reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mapping
          path: app/build/outputs/mapping/release/

  # -- GitHub Draft Release (sideload APK for phone install) ----------
  # Publishes the signed release APK + sigstore bundle + GPG .asc + checksums
  # to a *draft* GitHub Release. Open the draft on github.com (or the GitHub
  # Mobile app) and tap the APK asset to install on your Android device.
  #
  # Triggers on:
  #   - any push of a tag matching android-v*
  #   - manual workflow_dispatch (uses inputs.release_tag, falling back to run id)
  draft-release:
    name: Publish Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release APK artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-apk
          path: release-apk/

      - name: List artifacts
        run: ls -la release-apk/

      - name: Determine release tag
        id: tag
        # PFA-CI: pass user input via env (NOT direct ${{ }} expansion in
        # `run:` body — that would be a script-injection sink). Then enforce
        # a strict tag regex before letting it touch any downstream tool.
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_TAG" ]; then
              # Allowlist: alnum, dot, dash, underscore, max 64 chars.
              # Rejects shell metachars ($, `, ;, |, &, <, >, quotes, newline).
              if ! printf '%s' "$INPUT_TAG" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
                echo "::error::release_tag input failed validation: $INPUT_TAG"
                echo "::error::Must match ^[A-Za-z0-9._-]{1,64}$"
                exit 1
              fi
              TAG="$INPUT_TAG"
            else
              TAG="android-dispatch-${{ github.run_number }}"
            fi
          else
            TAG="${GITHUB_REF##*/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create / update draft GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2.4.0
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Birdo Android ${{ steps.tag.outputs.tag }}"
          draft: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
          fail_on_unmatched_files: false
          body: |
            ## Birdo VPN - Android sideload build

            **Build:** `${{ steps.tag.outputs.tag }}`
            **Commit:** `${{ github.sha }}`

            ### Install
            Download the `.apk` asset below on your Android device and tap it to install.
            The `.aab` asset is the Play Console upload artifact.
            You may need to enable **Install unknown apps** for your browser / file manager.

            ### Verify (optional)
            - Sigstore: `cosign verify-blob --bundle <apk>.sigstore <apk>`
            - GPG:      `gpg --verify <apk>.asc <apk>`  (key: https://birdo.app/.well-known/birdo-release.asc)
            - SHA256:   `sha256sum -c SHA256SUMS.txt`

            > This is a **draft** release - not visible to the public until you click "Publish".
          files: |
            release-apk/*.apk
            release-apk/*.apk.sigstore
            release-apk/*.apk.asc
            release-apk/*.aab
            release-apk/*.aab.sigstore
            release-apk/*.aab.asc
            release-apk/SHA256SUMS.txt
            release-apk/SHA256SUMS.txt.sigstore
            release-apk/SHA256SUMS.txt.asc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  play-upload:
    name: Upload AAB to Google Play
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ vars.PLAY_UPLOAD_ENABLED == 'true' && (startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch') }}
    # P5-CICD-18: production uploads run in the `production` environment so
    # required-reviewer protection can gate them. The protection rule itself
    # (Settings → Environments → production → Required reviewers) can only be
    # configured from the owner's GitHub console — until that is done this is
    # an ungated environment, so CONFIGURE IT. Test tracks (manual dispatch,
    # default 'internal') bind to `play-testing` and stay frictionless.
    environment: ${{ (github.event.inputs.play_track || 'production') == 'production' && 'production' || 'play-testing' }}
    # One Play edit at a time: two overlapping tag pushes would race the same
    # edit and the loser's state is undefined. Never cancel a running upload.
    concurrency:
      group: play-upload
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-apk
          path: release-apk/
      # ── Play upload: auto-submit for review, staged on production ───────────
      # A tagged release goes to PRODUCTION as a STAGED rollout (userFraction
      # 0.1 + status inProgress): every user at once was the P5-CICD-18 defect,
      # and completing/halting the stage from the Console is the canary this
      # pipeline never had. Test tracks don't support userFraction, so a manual
      # run to internal/alpha/beta keeps status completed.
      #
      # This is deliberately ONE upload rather than "internal now, promote to
      # production later": a promotion would re-upload the same AAB, and Play
      # rejects a versionCode it has already seen ("Version code N has already
      # been used"). Shipping the tag straight to its target track is the only
      # path that actually works.
      #
      # There is NO changesNotSentForReview fallback any more. That flag parks
      # the Play edit in the state that BLOCKS the next release until resolved
      # by hand (it bit this project before — see docs/PLAY-LAUNCH-PLAN.md),
      # and the old fallback fired it automatically while the workflow
      # reported success. A refused auto-submit now fails the job loudly and
      # the operator submits from the Console.
      - name: Upload AAB to Google Play (auto-submit for review)
        id: play_auto
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5 (node24)
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.birdo.vpn
          releaseFiles: release-apk/*.aab
          track: ${{ github.event.inputs.play_track || 'production' }}
          status: ${{ (github.event.inputs.play_track || 'production') == 'production' && 'inProgress' || 'completed' }}
          userFraction: ${{ (github.event.inputs.play_track || 'production') == 'production' && '0.1' || '' }}
          whatsNewDirectory: distribution/whatsnew
          changesNotSentForReview: false

      - name: Fail the run — auto-submit was refused (submit from the Play Console)
        if: steps.play_auto.outcome == 'failure'
        run: |
          echo "::error::The Play API refused the upload/auto-submit. NOT retrying with changesNotSentForReview: true — that flag parks the Play edit in a state that blocks the NEXT release until manually resolved, and it must never be set by automation. Upload and submit this AAB from the Play Console instead (asset: release-apk/*.aab, also attached to the GitHub release)."
          exit 1

      - name: Report Play upload
        run: |
          track="${{ github.event.inputs.play_track || 'production' }}"
          if [ "$track" = "production" ]; then
            echo "::notice::AAB uploaded and sent for review on PRODUCTION as a staged 10% rollout. Complete (or halt) the rollout from the Play Console once the canary looks healthy."
          else
            echo "::notice::AAB uploaded and sent for review on the '$track' track."
          fi

