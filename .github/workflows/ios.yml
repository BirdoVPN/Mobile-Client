name: iOS CI & Build

# ============================================================================
# iOS ships on the android-v* release train, UNSIGNED.
# ----------------------------------------------------------------------------
# Every mobile release tag (android-v*) builds the iOS app on a macOS runner
# and attaches an UNSIGNED .ipa to that same GitHub Release, alongside the
# Android .apk/.aab. The build carries NO Apple code signature — it is a
# public, verifiable build artifact, not an installable App Store product.
# App Store / TestFlight distribution stays gated behind the `release-ios`
# job (still `if: false`) until Apple Developer Program organisation
# verification unlocks code signing.
#
# Triggers:
#   * push of an android-v* tag  -> build + attach unsigned .ipa to that release
#   * manual workflow_dispatch    -> same, targeting inputs.release_tag
#                                     (used to backfill an existing release)
# ============================================================================

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing android-v* release tag to attach the unsigned iOS .ipa to (e.g. android-v1.4.8).'
        required: false
        type: string

# Minimum permissions - each job declares its own (publish-ios needs write).
permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # -- Build KMP Shared Framework --------------------------------------
  shared-framework:
    name: Build Shared Framework (iOS)
    runs-on: macos-14  # Apple Silicon for arm64 builds
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-ios-${{ runner.os }}-

      - name: Build shared framework for iOS
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Upload shared framework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosArm64/releaseFramework/
          retention-days: 5

  # -- Build iOS App (no signing) --------------------------------------
  build-ios:
    name: Build iOS App
    runs-on: macos-14
    needs: shared-framework
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Download shared framework
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosArm64/releaseFramework/

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -r | head -1)
          [ -z "$XCODE_PATH" ] && XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r | head -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      # BirdoPQNative.xcframework is a gitignored build artifact that
      # project.yml links against — without it the build fails with
      # "There is no XCFramework found at Vendor/BirdoPQNative.xcframework".
      # The script adds its own rustup targets; runners ship Rust already.
      - name: Build BirdoPQNative.xcframework
        run: |
          rustc --version
          ./scripts/build-birdo-pq-xcframework.sh

      # WireGuardKit declares .linkedLibrary("wg-go") but SwiftPM cannot run
      # the Makefile that produces it, so the PacketTunnel extension fails to
      # link with: ld: library 'wg-go' not found. Runners ship Go already.
      - name: Build libwg-go.a (device)
        run: |
          set -euo pipefail
          go version
          WG_LIB_DIR="$GITHUB_WORKSPACE/iosApp/.build-wg/iphoneos"
          mkdir -p "$WG_LIB_DIR"
          cd iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo
          make ARCHS=arm64 PLATFORM_NAME=iphoneos \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$WG_LIB_DIR" \
            CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/wggo"
          echo "WG_LIB_DIR=$WG_LIB_DIR" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app (no signing)
        working-directory: iosApp
        run: |
          xcodebuild build \
            -project BirdoVPN.xcodeproj \
            -scheme BirdoVPN \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            ARCHS=arm64 \
            LIBRARY_SEARCH_PATHS="$WG_LIB_DIR" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: birdo-vpn-ios-unsigned
          path: iosApp/build/Release-iphoneos/
          retention-days: 30

  # -- Package + attach the UNSIGNED .ipa to the android-v* release ------
  # Runs on ubuntu (packaging + upload only — no macOS minutes). Takes the
  # unsigned BirdoVPN.app built above, wraps it in a Payload/ .ipa, checksums
  # + Sigstore-signs it (parity with the Android assets), and appends it to
  # the SAME release the Android build publishes. `gh release upload
  # --clobber` ONLY adds/overwrites these iOS assets; it never touches the
  # release's draft/published state, notes, or the Android assets.
  publish-ios:
    name: Attach unsigned iOS .ipa to release
    runs-on: ubuntu-latest
    needs: build-ios
    if: startsWith(github.ref, 'refs/tags/android-v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write   # upload release assets
      id-token: write    # Sigstore keyless signing
    steps:
      - name: Download unsigned iOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: birdo-vpn-ios-unsigned
          path: ios-build/

      - name: Determine release tag
        id: tag
        # PFA-CI: user input reaches the shell only via env, never direct
        # ${{ }} interpolation in the run body, and is allowlist-validated
        # before touching any tool (same pattern as android.yml draft-release).
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_TAG" ]; then
              echo "::error::workflow_dispatch requires the release_tag input (an existing android-v* tag)."
              exit 1
            fi
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^android-v[0-9A-Za-z._-]{1,56}$'; then
              echo "::error::release_tag failed validation: $INPUT_TAG (must match ^android-v...)"
              exit 1
            fi
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          VER="$(printf '%s' "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ -z "$VER" ] && VER="$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (version $VER)"

      - name: Package unsigned .ipa
        id: pkg
        env:
          VER: ${{ steps.tag.outputs.ver }}
        run: |
          set -euo pipefail
          APP="$(find ios-build -maxdepth 3 -type d -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No .app found in the iOS build artifact."
            find ios-build -maxdepth 3 | head -50
            exit 1
          fi
          echo "Found app bundle: $APP"
          OUT="$GITHUB_WORKSPACE/ios-dist"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/"
          IPA="$OUT/BirdoVPN-${VER}-ios-unsigned.ipa"
          ( cd "$OUT" && zip -qr "$IPA" Payload )
          rm -rf "$OUT/Payload"
          ( cd "$OUT" && sha256sum "$(basename "$IPA")" > SHA256SUMS-ios.txt )
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "outdir=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sigstore-sign the .ipa (keyless)
        working-directory: ios-dist
        run: |
          set -euo pipefail
          IPA="$(basename "${{ steps.pkg.outputs.ipa }}")"
          cosign sign-blob --yes --bundle "${IPA}.sigstore" "$IPA"
          cosign sign-blob --yes --bundle "SHA256SUMS-ios.txt.sigstore" "SHA256SUMS-ios.txt"

      - name: Attach iOS assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: ios-dist
        # --clobber only adds/replaces these named iOS assets on an EXISTING
        # release; it does not create, publish, or alter release metadata. If
        # the tag has no release yet (e.g. iOS finished before the Android
        # draft was cut) the command fails loudly rather than inventing one.
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            BirdoVPN-*-ios-unsigned.ipa \
            BirdoVPN-*-ios-unsigned.ipa.sigstore \
            SHA256SUMS-ios.txt \
            SHA256SUMS-ios.txt.sigstore \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Attached unsigned iOS .ipa to release $TAG"

  # -- iOS Simulator Tests ---------------------------------------------
  test-ios:
    name: iOS Simulator Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-ios-${{ runner.os }}-

      - name: Build shared framework for iOS Simulator
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -r | head -1)
          [ -z "$XCODE_PATH" ] && XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r | head -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build BirdoPQNative.xcframework
        run: ./scripts/build-birdo-pq-xcframework.sh

      # Simulator slice. The upstream Makefile maps GOOS only for
      # macosx/iphoneos, so iphonesimulator must be passed explicitly.
      - name: Build libwg-go.a (simulator)
        run: |
          set -euo pipefail
          WG_LIB_DIR="$GITHUB_WORKSPACE/iosApp/.build-wg/iphonesimulator"
          mkdir -p "$WG_LIB_DIR"
          cd iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo
          make ARCHS=arm64 PLATFORM_NAME=iphonesimulator GOOS_iphonesimulator=ios \
            SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$WG_LIB_DIR" \
            CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/wggo-sim"
          echo "WG_LIB_DIR=$WG_LIB_DIR" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # Destination is NOT pinned to a specific OS version: the runner's
      # installed simulator runtime moves (it is currently iOS 18.6), and a
      # hard-coded OS=18.0 fails with "Unable to find a destination".
      # ARCHS/EXCLUDED_ARCHS: the KMP framework is iosSimulatorArm64 only.
      - name: Run iOS tests
        working-directory: iosApp
        run: |
          xcodebuild test \
            -project BirdoVPN.xcodeproj \
            -scheme BirdoVPN \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            LIBRARY_SEARCH_PATHS="$WG_LIB_DIR" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  # -- Signed Release & TestFlight Upload ---------------------------
  # DISABLED while iOS is paused. Kept in source so release wiring is preserved,
  # but it must not upload to TestFlight until the pause is deliberately lifted.
  #
  # Required GitHub repository SECRETS:
  #   APPLE_DIST_CERT_BASE64        - base64 of the .p12 distribution certificate
  #   APPLE_DIST_CERT_PASSWORD      - password for the .p12
  #   APPLE_PROVISIONING_PROFILE    - base64 of the .mobileprovision file
  #   APPLE_KEYCHAIN_PASSWORD       - ephemeral password for the temp keychain
  #   APPSTORE_API_KEY_ID           - App Store Connect API key ID (e.g. ABC123XYZ)
  #   APPSTORE_API_ISSUER_ID        - issuer UUID from App Store Connect
  #   APPSTORE_API_KEY_BASE64       - base64 of the .p8 private key
  #
  # Required GitHub repository VARIABLES:
  #   APPLE_TEAM_ID                 - 10-character Apple Developer team ID
  #   APPLE_BUNDLE_ID               - e.g. app.birdo.vpn
  release-ios:
    name: Codesign & Upload to TestFlight
    runs-on: macos-14
    needs: [shared-framework, build-ios, test-ios]
    if: ${{ false }}
    permissions:
      contents: read
      id-token: write   # for Sigstore Fulcio
    env:
      APPLE_TEAM_ID:    ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID:  ${{ vars.APPLE_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # KEYCHAIN_PATH must be set in a step (the `runner` context is not
      # available at job-level `env:`). Persist via $GITHUB_ENV so all later
      # steps see the same path.
      - name: Set keychain path
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/birdo-build.keychain-db" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Build shared framework (Release, iosArm64)
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -r | head -1)
          [ -z "$XCODE_PATH" ] && XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r | head -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build BirdoPQNative.xcframework
        run: ./scripts/build-birdo-pq-xcframework.sh

      - name: Build libwg-go.a (device)
        run: |
          set -euo pipefail
          WG_LIB_DIR="$GITHUB_WORKSPACE/iosApp/.build-wg/iphoneos"
          mkdir -p "$WG_LIB_DIR"
          cd iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo
          make ARCHS=arm64 PLATFORM_NAME=iphoneos \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$WG_LIB_DIR" \
            CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/wggo"
          echo "WG_LIB_DIR=$WG_LIB_DIR" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # -- Import Apple Distribution Certificate into a temporary keychain --
      # SEC: keychain is created in $RUNNER_TEMP and destroyed in the
      # cleanup step. Passwords are masked from logs by GitHub Actions.
      - name: Import Apple Distribution certificate
        env:
          CERT_B64:      ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          KC_PASSWORD:   ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/birdo.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>            <string>app-store-connect</string>
            <key>teamID</key>            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>      <string>manual</string>
            <key>stripSwiftSymbols</key> <true/>
            <key>uploadBitcode</key>     <false/>
            <key>uploadSymbols</key>     <true/>
            <key>destination</key>       <string>upload</string>
          </dict>
          </plist>
          EOF

      - name: Archive (xcodebuild)
        working-directory: iosApp
        run: |
          xcodebuild archive \
            -project BirdoVPN.xcodeproj \
            -scheme BirdoVPN \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/BirdoVPN.xcarchive" \
            ARCHS=arm64 \
            LIBRARY_SEARCH_PATHS="$WG_LIB_DIR" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            | xcpretty

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BirdoVPN.xcarchive" \
            -exportPath  "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            | xcpretty

      # -- Sigstore keyless signing of the .ipa for public verifiability --
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign IPA with Sigstore
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [ -n "$IPA" ]; then
            cosign sign-blob --yes --bundle "${IPA}.sigstore" "$IPA"
            sha256sum "$IPA" > "${IPA}.sha256"
            cosign sign-blob --yes --bundle "${IPA}.sha256.sigstore" "${IPA}.sha256"
          fi

      # -- Upload to App Store Connect / TestFlight via API key ----------
      - name: Install API key for altool
        env:
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          API_KEY_ID:  ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Upload to TestFlight
        env:
          API_KEY_ID:    ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --output-format xml

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: birdo-vpn-ios-signed
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/*.sigstore
            ${{ runner.temp }}/export/*.sha256
            ${{ runner.temp }}/export/*.sha256.sigstore
          retention-days: 30

      - name: Cleanup keychain & API keys
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/birdo.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

