name: iOS CI & Build

# ============================================================================
# iOS ships on the android-v* release train, UNSIGNED.
# ----------------------------------------------------------------------------
# Every mobile release tag (android-v*) builds the iOS app on a macOS runner
# and attaches an UNSIGNED .ipa to that same GitHub Release, alongside the
# Android .apk/.aab. The build carries NO Apple code signature — it is a
# public, verifiable build artifact, not an installable App Store product.
# App Store / TestFlight distribution is LIVE as of 2026-07-31: the same tag
# additionally produces a SIGNED build that `release-ios` uploads to TestFlight.
# That job is gated on the tag ref, so branch pushes never reach App Store
# Connect — see the note above the job.
#
# Triggers:
#   * push of an android-v* tag  -> build + attach unsigned .ipa to that release,
#                                     and upload a signed build to TestFlight
#   * manual workflow_dispatch    -> same, targeting inputs.release_tag
#                                     (used to backfill an existing release).
#                                     Pass upload_testflight=true to also cut a
#                                     signed TestFlight build without pushing a
#                                     tag (a tag would release Android to Play).
# ============================================================================

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing android-v* release tag to attach the unsigned iOS .ipa to (e.g. android-v1.4.8).'
        required: false
        type: string
      upload_testflight:
        description: 'Codesign this build and upload it to TestFlight. Off by default — an android-v* tag does this automatically, so this is for cutting a test build WITHOUT a public Android release.'
        required: false
        default: false
        type: boolean

# Minimum permissions - each job declares its own (publish-ios needs write).
permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # -- Build KMP Shared Framework --------------------------------------
  shared-framework:
    name: Build Shared Framework (iOS)
    runs-on: macos-14  # Apple Silicon for arm64 builds
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-ios-${{ runner.os }}-

      - name: Build shared framework for iOS
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Upload shared framework
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosArm64/releaseFramework/
          retention-days: 5

  # -- Build iOS App (no signing) --------------------------------------
  build-ios:
    name: Build iOS App
    runs-on: macos-14
    needs: shared-framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download shared framework
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: shared-framework-ios
          path: shared/build/bin/iosArm64/releaseFramework/

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -r | head -1)
          [ -z "$XCODE_PATH" ] && XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r | head -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      # BirdoPQNative.xcframework is a gitignored build artifact that
      # project.yml links against — without it the build fails with
      # "There is no XCFramework found at Vendor/BirdoPQNative.xcframework".
      # The script adds its own rustup targets; runners ship Rust already.
      - name: Build BirdoPQNative.xcframework
        run: |
          rustc --version
          bash ./scripts/build-birdo-pq-xcframework.sh

      # WireGuardKit declares .linkedLibrary("wg-go") but SwiftPM cannot run
      # the Makefile that produces it, so the PacketTunnel extension fails to
      # link with: ld: library 'wg-go' not found.
      #
      # The WireGuardKitGo Makefile requires a system Go toolchain: its
      # `$(GOROOT)/.prepared` target asserts `go env GOROOT` is non-empty and
      # rsyncs it. The macos-14 image no longer ships Go on PATH, so install
      # it explicitly (was `go: command not found`).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Build libwg-go.a (device)
        run: |
          set -euo pipefail
          go version
          WG_LIB_DIR="$GITHUB_WORKSPACE/iosApp/.build-wg/iphoneos"
          mkdir -p "$WG_LIB_DIR"
          cd iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo
          make ARCHS=arm64 PLATFORM_NAME=iphoneos \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$WG_LIB_DIR" \
            CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/wggo"
          echo "WG_LIB_DIR=$WG_LIB_DIR" >> "$GITHUB_ENV"

      - name: Derive iOS version from version.properties
        # SINGLE SOURCE OF TRUTH, shared with Android, so one bump versions both
        # platforms and they cannot drift.
        #
        # This exists because both Info.plists hardcoded 1.0.0 and nothing ever
        # overrode them: every shipped iOS build reported itself as 1.0.0 in its
        # User-Agent and device payload. The backend could not distinguish a
        # current client from a months-old one, no iOS version floor could be
        # enforced, and the admin fleet view showed a version never released.
        #
        # The build number matches Android's derivation (major*10000 +
        # minor*100 + patch) so CFBundleVersion rises monotonically across
        # releases, which App Store Connect requires.
        run: |
          set -euo pipefail
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "::error::Could not parse version.properties — refusing to build an unversioned IPA"
            exit 1
          fi
          echo "BIRDO_MARKETING_VERSION=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_ENV"
          echo "BIRDO_PROJECT_VERSION=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_ENV"
          echo "iOS version ${MAJOR}.${MINOR}.${PATCH} (build $(( MAJOR * 10000 + MINOR * 100 + PATCH )))"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Build iOS app (no signing)
        working-directory: iosApp
        # SYMROOT pins the built products to iosApp/build/ so the upload step
        # below can find BirdoVPN.app. Without it, `xcodebuild build` writes to
        # Xcode's DerivedData (a hashed path), leaving iosApp/build/Release-
        # iphoneos/ empty — the upload then silently produced no artifact.
        # `set -o pipefail` so a build failure isn't masked by the xcpretty pipe.
        run: |
          set -o pipefail
          xcodebuild build \
            -project BirdoVPN.xcodeproj \
            -scheme BirdoVPN \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$BIRDO_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BIRDO_PROJECT_VERSION" \
            ARCHS=arm64 \
            LIBRARY_SEARCH_PATHS="$WG_LIB_DIR" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty
          echo "== built products =="; ls -la "$PWD/build/Release-iphoneos" || true

      - name: Verify the built app reports the real version
        working-directory: iosApp
        # REGRESSION GUARD. The plists hardcoded 1.0.0 for months and nothing
        # caught it, because a wrong-but-plausible version breaks nothing at
        # build time — it only shows up later as unusable telemetry and an
        # unenforceable version floor. This asserts the shipped binary actually
        # carries version.properties' value, and checks the appex matches the
        # host app (App Store validation rejects a mismatch, and finding that
        # out during an upload is far more expensive than finding it here).
        run: |
          set -euo pipefail
          APP_PLIST="build/Release-iphoneos/BirdoVPN.app/Info.plist"
          EXT_PLIST="build/Release-iphoneos/BirdoVPN.app/PlugIns/PacketTunnel.appex/Info.plist"

          app_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PLIST")
          app_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP_PLIST")
          echo "app: $app_version ($app_build)"

          if [ "$app_version" != "$BIRDO_MARKETING_VERSION" ]; then
            echo "::error::App reports '$app_version' but version.properties says '$BIRDO_MARKETING_VERSION'"
            exit 1
          fi
          if [ "$app_build" != "$BIRDO_PROJECT_VERSION" ]; then
            echo "::error::App build number '$app_build' != expected '$BIRDO_PROJECT_VERSION'"
            exit 1
          fi

          if [ -f "$EXT_PLIST" ]; then
            ext_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$EXT_PLIST")
            ext_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$EXT_PLIST")
            echo "appex: $ext_version ($ext_build)"
            if [ "$ext_version" != "$app_version" ] || [ "$ext_build" != "$app_build" ]; then
              echo "::error::PacketTunnel appex version ($ext_version/$ext_build) != host app ($app_version/$app_build) — App Store validation rejects this"
              exit 1
            fi
          else
            echo "::error::PacketTunnel.appex missing from the built app — the tunnel cannot load without it"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: birdo-vpn-ios-unsigned
          path: iosApp/build/Release-iphoneos/
          retention-days: 30
          # Fail loudly if the build produced nothing (instead of a silent
          # empty artifact that only breaks the downstream publish job).
          if-no-files-found: error

  # -- Package + attach the UNSIGNED .ipa to the android-v* release ------
  # Runs on ubuntu (packaging + upload only — no macOS minutes). Takes the
  # unsigned BirdoVPN.app built above, wraps it in a Payload/ .ipa, checksums
  # + Sigstore-signs it (parity with the Android assets), and appends it to
  # the SAME release the Android build publishes. `gh release upload
  # --clobber` ONLY adds/overwrites these iOS assets; it never touches the
  # release's draft/published state, notes, or the Android assets.
  publish-ios:
    name: Attach unsigned iOS .ipa to release
    runs-on: ubuntu-latest
    needs: build-ios
    # A workflow_dispatch WITHOUT release_tag is a verification run — someone
    # checking that a branch still builds for iOS, which PR CI never does. There
    # is no release to attach to, so this job used to run anyway and fail at
    # "Determine release tag", painting the whole run red for a build that was
    # completely fine.
    #
    # That matters beyond tidiness: the branch-verification dispatch is the ONLY
    # signal that a shared-module or Vendor change compiles for iOS, and a run
    # that always ends red trains you to ignore exactly the check you dispatched
    # it for. Skip cleanly instead, so red means red.
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    permissions:
      contents: write   # upload release assets
      id-token: write    # Sigstore keyless signing
    steps:
      - name: Download unsigned iOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: birdo-vpn-ios-unsigned
          path: ios-build/

      - name: Determine release tag
        id: tag
        # PFA-CI: user input reaches the shell only via env, never direct
        # ${{ }} interpolation in the run body, and is allowlist-validated
        # before touching any tool (same pattern as android.yml draft-release).
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_TAG" ]; then
              echo "::error::workflow_dispatch requires the release_tag input (an existing android-v* tag)."
              exit 1
            fi
            if ! printf '%s' "$INPUT_TAG" | grep -Eq '^android-v[0-9A-Za-z._-]{1,56}$'; then
              echo "::error::release_tag failed validation: $INPUT_TAG (must match ^android-v...)"
              exit 1
            fi
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          VER="$(printf '%s' "$TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ -z "$VER" ] && VER="$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (version $VER)"

      - name: Package unsigned .ipa
        id: pkg
        env:
          VER: ${{ steps.tag.outputs.ver }}
        run: |
          set -euo pipefail
          APP="$(find ios-build -maxdepth 3 -type d -name '*.app' | head -1)"
          if [ -z "$APP" ]; then
            echo "::error::No .app found in the iOS build artifact."
            find ios-build -maxdepth 3 | head -50
            exit 1
          fi
          echo "Found app bundle: $APP"
          OUT="$GITHUB_WORKSPACE/ios-dist"
          mkdir -p "$OUT/Payload"
          cp -R "$APP" "$OUT/Payload/"
          IPA="$OUT/BirdoVPN-${VER}-ios-unsigned.ipa"
          ( cd "$OUT" && zip -qr "$IPA" Payload )
          rm -rf "$OUT/Payload"
          ( cd "$OUT" && sha256sum "$(basename "$IPA")" > SHA256SUMS-ios.txt )
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          echo "outdir=$OUT" >> "$GITHUB_OUTPUT"
          ls -la "$OUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sigstore-sign the .ipa (keyless)
        working-directory: ios-dist
        run: |
          set -euo pipefail
          IPA="$(basename "${{ steps.pkg.outputs.ipa }}")"
          cosign sign-blob --yes --bundle "${IPA}.sigstore" "$IPA"
          cosign sign-blob --yes --bundle "SHA256SUMS-ios.txt.sigstore" "SHA256SUMS-ios.txt"

      - name: Attach iOS assets to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: ios-dist
        # Attaches ONLY these named iOS assets to the release for $TAG. It never
        # creates a release, and never changes draft/prerelease state, notes, or
        # the Android assets — publishing stays a deliberate human action.
        #
        # WHY NOT `gh release upload "$TAG"`
        # ----------------------------------
        # That is what this step used to do, and it failed on EVERY release with
        # "release not found" while the Android .apk/.aab sat happily on the very
        # release it could not find.
        #
        # The Android job cuts the release as a DRAFT. `gh release upload`
        # resolves a tag via GET /repos/{o}/{r}/releases/tags/{tag}, and that
        # endpoint does not return drafts — a draft has no published tag ref to
        # match. So the lookup 404s no matter how long you wait. It was never a
        # race; waiting longer could not have fixed it.
        #
        # GET /repos/{o}/{r}/releases (the list endpoint) DOES include drafts, so
        # resolve the id there and upload against the id instead.
        #
        # The retry loop is for the genuine, separate race: iOS can finish before
        # the Android job has cut the draft at all.
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          REL_ID=""
          for attempt in $(seq 1 30); do
            REL_ID="$(gh api --paginate "repos/$REPO/releases" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null | head -1 || true)"
            [ -n "$REL_ID" ] && break
            echo "No release for $TAG yet (attempt $attempt/30) — waiting for the Android job to cut it…"
            sleep 10
          done

          if [ -z "$REL_ID" ]; then
            echo "::error::No release (draft or published) found for tag $TAG after 5 minutes."
            exit 1
          fi
          echo "Resolved release id $REL_ID for $TAG"

          shopt -s nullglob
          FILES=(BirdoVPN-*-ios-unsigned.ipa BirdoVPN-*-ios-unsigned.ipa.sigstore \
                 SHA256SUMS-ios.txt SHA256SUMS-ios.txt.sigstore)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::No iOS assets to attach — packaging produced nothing."
            exit 1
          fi

          for f in "${FILES[@]}"; do
            name="$(basename "$f")"
            # Replaces an existing asset of the same name (what --clobber did);
            # the upload endpoint 422s on a duplicate name otherwise, which would
            # make a re-run of this job fail instead of being idempotent.
            old="$(gh api "repos/$REPO/releases/$REL_ID/assets" \
              --jq ".[] | select(.name == \"$name\") | .id" 2>/dev/null | head -1 || true)"
            if [ -n "$old" ]; then
              gh api --method DELETE "repos/$REPO/releases/assets/$old" >/dev/null
              echo "  replaced existing $name"
            fi
            # Asset uploads go to uploads.github.com, not api.github.com.
            gh api --method POST \
              "https://uploads.github.com/repos/$REPO/releases/$REL_ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" \
              --input "$f" >/dev/null
            echo "  attached $name"
          done
          echo "Attached ${#FILES[@]} iOS asset(s) to release $TAG (id $REL_ID)"
          echo "Attached unsigned iOS .ipa to release $TAG"

  # -- iOS Simulator Tests ---------------------------------------------
  test-ios:
    name: iOS Simulator Tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-ios-${{ runner.os }}-

      - name: Build shared framework for iOS Simulator
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -r | head -1)
          [ -z "$XCODE_PATH" ] && XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r | head -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build BirdoPQNative.xcframework
        run: bash ./scripts/build-birdo-pq-xcframework.sh

      # Simulator slice. The upstream Makefile maps GOOS only for
      # macosx/iphoneos, so iphonesimulator must be passed explicitly.
      # macos-14 no longer ships Go on PATH; the Makefile needs it.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Build libwg-go.a (simulator)
        run: |
          set -euo pipefail
          WG_LIB_DIR="$GITHUB_WORKSPACE/iosApp/.build-wg/iphonesimulator"
          mkdir -p "$WG_LIB_DIR"
          cd iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo
          make ARCHS=arm64 PLATFORM_NAME=iphonesimulator GOOS_iphonesimulator=ios \
            SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$WG_LIB_DIR" \
            CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/wggo-sim"
          echo "WG_LIB_DIR=$WG_LIB_DIR" >> "$GITHUB_ENV"

      - name: Derive iOS version from version.properties
        # SINGLE SOURCE OF TRUTH, shared with Android, so one bump versions both
        # platforms and they cannot drift.
        #
        # This exists because both Info.plists hardcoded 1.0.0 and nothing ever
        # overrode them: every shipped iOS build reported itself as 1.0.0 in its
        # User-Agent and device payload. The backend could not distinguish a
        # current client from a months-old one, no iOS version floor could be
        # enforced, and the admin fleet view showed a version never released.
        #
        # The build number matches Android's derivation (major*10000 +
        # minor*100 + patch) so CFBundleVersion rises monotonically across
        # releases, which App Store Connect requires.
        run: |
          set -euo pipefail
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "::error::Could not parse version.properties — refusing to build an unversioned IPA"
            exit 1
          fi
          echo "BIRDO_MARKETING_VERSION=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_ENV"
          echo "BIRDO_PROJECT_VERSION=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_ENV"
          echo "iOS version ${MAJOR}.${MINOR}.${PATCH} (build $(( MAJOR * 10000 + MINOR * 100 + PATCH )))"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # Destination is NOT pinned to a specific OS version: the runner's
      # installed simulator runtime moves (it is currently iOS 18.6), and a
      # hard-coded OS=18.0 fails with "Unable to find a destination".
      # ARCHS/EXCLUDED_ARCHS: the KMP framework is iosSimulatorArm64 only.
      - name: Run iOS tests
        working-directory: iosApp
        run: |
          xcodebuild test \
            -project BirdoVPN.xcodeproj \
            -scheme BirdoVPN \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            LIBRARY_SEARCH_PATHS="$WG_LIB_DIR" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

  # -- Signed Release & TestFlight Upload ---------------------------
  # ENABLED 2026-07-31: the pause is deliberately lifted — code signing is
  # unlocked and every required secret/variable is configured, so an android-v*
  # tag now ships a signed build to TestFlight alongside the unsigned .ipa.
  #
  # Gated on the tag ref rather than left unconditional: a branch push or PR
  # must never reach App Store Connect, and a CFBundleVersion is single-use —
  # ASC rejects a re-upload of a build number it has already seen, so a non-tag
  # run would burn the version it collided with.
  #
  # Required GitHub repository SECRETS:
  #   APPLE_DIST_CERT_BASE64        - base64 of the .p12 distribution certificate
  #   APPLE_DIST_CERT_PASSWORD      - password for the .p12
  #   APPLE_PROVISIONING_PROFILE    - base64 of the .mobileprovision file
  #   APPLE_KEYCHAIN_PASSWORD       - ephemeral password for the temp keychain
  #   APPSTORE_API_KEY_ID           - App Store Connect API key ID (e.g. ABC123XYZ)
  #   APPSTORE_API_ISSUER_ID        - issuer UUID from App Store Connect
  #   APPSTORE_API_KEY_BASE64       - base64 of the .p8 private key
  #
  # Required GitHub repository VARIABLES:
  #   APPLE_TEAM_ID                 - 10-character Apple Developer team ID
  #   APPLE_BUNDLE_ID               - e.g. app.birdo.vpn
  release-ios:
    name: Codesign & Upload to TestFlight
    runs-on: macos-14
    needs: [shared-framework, build-ios, test-ios]
    # A release tag, or a dispatch that explicitly asked for a TestFlight build.
    #
    # The dispatch arm exists because an android-v* tag also fires android.yml,
    # which uploads straight to production Play — so without it, getting a build
    # onto a test device would mean shipping a public Android release first.
    #
    # This deliberately keys off its OWN input rather than reusing release_tag:
    # release_tag drives publish-ios, so borrowing it would re-attach a freshly
    # built .ipa to an already-published release, replacing that release's asset
    # with one built from newer code than the tag it claims to be. A bare
    # dispatch still skips both — uploading must stay a deliberate act, never a
    # side effect of a branch verification run.
    if: >-
      startsWith(github.ref, 'refs/tags/android-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.upload_testflight)
    permissions:
      contents: read
      id-token: write   # for Sigstore Fulcio
    env:
      APPLE_TEAM_ID:    ${{ vars.APPLE_TEAM_ID }}
      APPLE_BUNDLE_ID:  ${{ vars.APPLE_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # KEYCHAIN_PATH must be set in a step (the `runner` context is not
      # available at job-level `env:`). Persist via $GITHUB_ENV so all later
      # steps see the same path.
      - name: Set keychain path
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/birdo-build.keychain-db" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Build shared framework (Release, iosArm64)
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -r | head -1)
          [ -z "$XCODE_PATH" ] && XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -r | head -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build BirdoPQNative.xcframework
        run: bash ./scripts/build-birdo-pq-xcframework.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Build libwg-go.a (device)
        run: |
          set -euo pipefail
          WG_LIB_DIR="$GITHUB_WORKSPACE/iosApp/.build-wg/iphoneos"
          mkdir -p "$WG_LIB_DIR"
          cd iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo
          make ARCHS=arm64 PLATFORM_NAME=iphoneos \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$WG_LIB_DIR" \
            CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/wggo"
          echo "WG_LIB_DIR=$WG_LIB_DIR" >> "$GITHUB_ENV"

      - name: Derive iOS version from version.properties
        # SINGLE SOURCE OF TRUTH, shared with Android, so one bump versions both
        # platforms and they cannot drift.
        #
        # This exists because both Info.plists hardcoded 1.0.0 and nothing ever
        # overrode them: every shipped iOS build reported itself as 1.0.0 in its
        # User-Agent and device payload. The backend could not distinguish a
        # current client from a months-old one, no iOS version floor could be
        # enforced, and the admin fleet view showed a version never released.
        #
        # The build number matches Android's derivation (major*10000 +
        # minor*100 + patch) so CFBundleVersion rises monotonically across
        # releases, which App Store Connect requires.
        run: |
          set -euo pipefail
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$MAJOR" ] || [ -z "$MINOR" ] || [ -z "$PATCH" ]; then
            echo "::error::Could not parse version.properties — refusing to build an unversioned IPA"
            exit 1
          fi
          echo "BIRDO_MARKETING_VERSION=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_ENV"
          echo "BIRDO_PROJECT_VERSION=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_ENV"
          echo "iOS version ${MAJOR}.${MINOR}.${PATCH} (build $(( MAJOR * 10000 + MINOR * 100 + PATCH )))"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # -- Import Apple Distribution Certificate into a temporary keychain --
      # SEC: keychain is created in $RUNNER_TEMP and destroyed in the
      # cleanup step. Passwords are masked from logs by GitHub Actions.
      - name: Import Apple Distribution certificate
        env:
          CERT_B64:      ${{ secrets.APPLE_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          KC_PASSWORD:   ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$CERT_B64" | base64 --decode > "$CERT_PATH"

          # Diagnostic only — never fatal, `security import` stays the authority.
          # errSecParam from the import is ambiguous: it means either the flags
          # are wrong or the secret didn't decode to a usable .p12. This says
          # which, so the next failure doesn't need a guess. Kept non-fatal
          # because an openssl that can't read a modern PKCS#12 would otherwise
          # fail a perfectly good certificate.
          if openssl pkcs12 -in "$CERT_PATH" -passin pass:"$CERT_PASSWORD" -noout 2>/dev/null; then
            echo "PKCS#12 parsed OK ($(wc -c < "$CERT_PATH") bytes)"
          else
            echo "::warning::Decoded file did not parse as PKCS#12 with the supplied password. If the import below fails, suspect APPLE_DIST_CERT_BASE64/APPLE_DIST_CERT_PASSWORD rather than the import flags."
          fi

          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN_PATH"
          # -t agg, NOT -t cert: a distribution .p12 is an AGGREGATE holding the
          # private key alongside the certificate. Pairing -f pkcs12 with
          # -t cert asserts the file is a bare certificate, and that
          # contradiction is what SecKeychainItemImport rejects as errSecParam
          # ("One or more parameters passed to a function were not valid") —
          # which reads like a bad secret but is purely a flag mismatch.
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A -t agg -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/birdo.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"

      - name: Write ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>            <string>app-store-connect</string>
            <key>teamID</key>            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>      <string>manual</string>
            <key>stripSwiftSymbols</key> <true/>
            <key>uploadBitcode</key>     <false/>
            <key>uploadSymbols</key>     <true/>
            <key>destination</key>       <string>upload</string>
          </dict>
          </plist>
          EOF

      - name: Archive (xcodebuild)
        working-directory: iosApp
        # `set -o pipefail` so a failed archive isn't swallowed by the xcpretty
        # pipe — without it the step exits 0 on xcpretty's success and the job
        # marches on to export/upload an archive that was never produced. The
        # unsigned build step below already does this; this one did not.
        run: |
          set -o pipefail
          xcodebuild archive \
            -project BirdoVPN.xcodeproj \
            -scheme BirdoVPN \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/BirdoVPN.xcarchive" \
            MARKETING_VERSION="$BIRDO_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BIRDO_PROJECT_VERSION" \
            ARCHS=arm64 \
            LIBRARY_SEARCH_PATHS="$WG_LIB_DIR" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PRODUCT_BUNDLE_IDENTIFIER="$APPLE_BUNDLE_ID" \
            | xcpretty

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/BirdoVPN.xcarchive" \
            -exportPath  "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            | xcpretty

      # -- Sigstore keyless signing of the .ipa for public verifiability --
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign IPA with Sigstore
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [ -n "$IPA" ]; then
            cosign sign-blob --yes --bundle "${IPA}.sigstore" "$IPA"
            sha256sum "$IPA" > "${IPA}.sha256"
            cosign sign-blob --yes --bundle "${IPA}.sha256.sigstore" "${IPA}.sha256"
          fi

      # -- Upload to App Store Connect / TestFlight via API key ----------
      - name: Install API key for altool
        env:
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          API_KEY_ID:  ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY_B64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Upload to TestFlight
        env:
          API_KEY_ID:    ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --output-format xml

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: birdo-vpn-ios-signed
          path: |
            ${{ runner.temp }}/export/*.ipa
            ${{ runner.temp }}/export/*.sigstore
            ${{ runner.temp }}/export/*.sha256
            ${{ runner.temp }}/export/*.sha256.sigstore
          retention-days: 30

      - name: Cleanup keychain & API keys
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/birdo.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

