# CodeQL — Swift (iOS app + PacketTunnel extension)
#
# OPEN-WORK G7: the estate's CodeQL coverage was java-kotlin ONLY. Every line
# of Swift in this repo — the iOS app and, more importantly, the PacketTunnel
# network extension that terminates the tunnel — was scanned by nothing, and
# `.github/codeql/codeql-config.yml` explicitly lists `iosApp/**` under
# paths-ignore. macOS ships from the same sources, so the gap covered two
# products.
#
# WHY THIS IS ITS OWN WORKFLOW, and not a job in ios.yml or apple-ci.yml
# ----------------------------------------------------------------------
# ios.yml is the release pipeline (tags, TestFlight). apple-ci.yml is the fast
# PR signal; a traced CodeQL build is several times slower than a plain one and
# must not hold that signal up. Not a required check.
#
# WHY THE BUILD CHAIN IS REPEATED HERE
# ------------------------------------
# CodeQL's Swift extractor observes a real compile — there is no build-mode
# `none` for Swift — and `BirdoVPN.xcodeproj` does not exist in git: XcodeGen
# generates it, and the project links two artefacts that are also generated
# (BirdoPQNative.xcframework from Rust, libwg-go.a from Go). So the
# prerequisite steps below mirror ios.yml's `build-ios` job. **If that job's
# build chain changes, change it here too** — the failure mode is this scan
# going red, not a silent gap, because a broken chain cannot produce a
# database.
#
# WHEN IT RUNS
# ------------
# Pull requests and main pushes that change Swift sources or this scan's own
# configuration, a weekly sweep, and on demand. A Kotlin-only change to
# shared/ changes no Swift source; apple-ci.yml still compiles the Swift
# against it.
#
# WHERE THE TIME WENT (run 37057051350, 31.6 min, 23.4 of them in the traced
# xcodebuild): ~8 min in "Resolve Package Graph" for the one LOCAL Swift
# package, and ~9 min of single-threaded extraction of whole-module (WMO)
# compiles.
#   * Extraction: the traced build compiles in batch mode, so extraction runs
#     on every core (measured on #464: ~9 -> ~4.5 min). The compilation
#     CONDITIONS stay Release's (no DEBUG), so the code CodeQL sees is the code
#     that ships; only the optimiser level and batching differ, and neither
#     changes the source being analysed.
#   * Package graph: still ~8 min under the tracer, and NOT for the two
#     obvious reasons -- both were measured on #464 and refuted: resolving the
#     graph before tracing starts (traced step still 530 s; the traced build
#     evaluates Package.swift again) and turning off SwiftPM's manifest sandbox
#     (466 s). Removing SwiftPM from the build (WireGuardKit as a project
#     target instead of a local package) would remove it; that is a project
#     change, not a CI one. Meanwhile this scan runs only when Swift changes,
#     and it is not a required check.
name: CodeQL Swift

on:
  pull_request:
    paths:
      - 'iosApp/**/*.swift'
      - 'iosApp/project.yml'
      - '.github/workflows/codeql-swift.yml'
      - '.github/codeql/codeql-config-swift.yml'
      - '.github/actions/apple-toolchain/**'
  push:
    branches: [main]
    paths:
      - 'iosApp/**/*.swift'
      - 'iosApp/project.yml'
      - '.github/workflows/codeql-swift.yml'
      - '.github/codeql/codeql-config-swift.yml'
      - '.github/actions/apple-toolchain/**'
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC — same slot the retired codeql.yml used
  workflow_dispatch:

permissions: {}

# The event is part of the group: the scheduled run and main pushes share a
# ref, and one would otherwise displace the other's pending run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  analyze:
    name: Analyze (swift)
    # The weekly sweep runs only in this repository, never in a fork.
    if: ${{ github.event_name != 'schedule' || github.repository == 'BirdoVPN/Mobile-Client' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      # The same pinned Xcode the shipped build uses, so the Swift version the
      # extractor sees is identical to the one that ships. Selected before the
      # Kotlin/Native link, which uses the active Xcode's SDK.
      - uses: ./.github/actions/apple-toolchain

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ── prerequisites: mirror of ios.yml's build-ios job ──────────────────
      - name: Build shared framework for iOS
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64

      - name: Restore the BirdoPQ Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            native/birdo-pq-ios/target
          key: birdo-pq-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'native/birdo-pq-ios/Cargo.lock', 'scripts/build-birdo-pq-xcframework.sh') }}
          restore-keys: birdo-pq-ios-${{ runner.os }}-${{ runner.arch }}-

      - name: Build BirdoPQNative.xcframework
        run: |
          rustc --version
          bash ./scripts/build-birdo-pq-xcframework.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache-dependency-path: iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo/go.sum

      - name: Build libwg-go.a (device)
        run: |
          set -euo pipefail
          WG_LIB_DIR="$GITHUB_WORKSPACE/iosApp/.build-wg/iphoneos"
          mkdir -p "$WG_LIB_DIR"
          cd iosApp/Vendor/wireguard-apple/Sources/WireGuardKitGo
          make ARCHS=arm64 PLATFORM_NAME=iphoneos \
            DEPLOYMENT_TARGET_CLANG_FLAG_NAME=mios-version-min \
            DEPLOYMENT_TARGET_CLANG_ENV_NAME=IPHONEOS_DEPLOYMENT_TARGET \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)" \
            CONFIGURATION_BUILD_DIR="$WG_LIB_DIR" \
            CONFIGURATION_TEMP_DIR="$RUNNER_TEMP/wggo"
          echo "WG_LIB_DIR=$WG_LIB_DIR" >> "$GITHUB_ENV"

      - name: Derive version from version.properties
        # project.yml reads these; a scan build with no version still has to
        # produce the same target settings as the release build.
        run: |
          set -euo pipefail
          MAJOR=$(grep '^VERSION_MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep '^VERSION_MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          PATCH=$(grep '^VERSION_PATCH=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "BIRDO_MARKETING_VERSION=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_ENV"
          echo "BIRDO_PROJECT_VERSION=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # ── the scan ──────────────────────────────────────────────────────────
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
          config-file: ./.github/codeql/codeql-config-swift.yml

      # Release configuration (same compilation conditions as the shipped app),
      # but SWIFT_COMPILATION_MODE=singlefile and -Onone: whole-module mode put
      # each module's extraction on one core for minutes at a time, and the
      # optimiser output is not something CodeQL reads.
      - name: Build iOS app for CodeQL (no signing)
        working-directory: iosApp
        run: |
          set -o pipefail
          xcodebuild build \
            -project BirdoVPN.xcodeproj \
            -scheme BirdoVPN \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            SYMROOT="$PWD/build" \
            MARKETING_VERSION="$BIRDO_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BIRDO_PROJECT_VERSION" \
            ARCHS=arm64 \
            LIBRARY_SEARCH_PATHS="$WG_LIB_DIR" \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_OPTIMIZATION_LEVEL=-Onone \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:swift'
