name: "Birdo Swift CodeQL Config"

# Companion to codeql-config.yml (java-kotlin). That file lists `iosApp/**`
# under paths-ignore — which is exactly why the Swift sources were scanned by
# nothing until OPEN-WORK G7. This config is the mirror image: it scans the
# Swift the app and the PacketTunnel extension are built from, and nothing else.

queries:
  - uses: security-and-quality

paths:
  - iosApp

paths-ignore:
  # Vendored upstream. WireGuardKit/WireGuardKitGo is Jason Donenfeld's code,
  # tracked as a vendor copy; alerts here are not actionable in this repo and
  # would drown the ones that are. Upstream security tracking is the right
  # channel for it — see docs/native/ROADMAP.md on the vendoring decision.
  - iosApp/Vendor/**
  # Generated by XcodeGen at build time, never authored.
  - iosApp/BirdoVPN.xcodeproj/**
  # Build products.
  - iosApp/build/**
  - iosApp/.build-wg/**

query-filters:
  # The tunnel extension deliberately blocks on the wg-go handshake inside
  # startTunnel(): NEPacketTunnelProvider's contract is that the completion
  # handler is called only once the tunnel is genuinely up, and returning
  # early is how you get a UI that says "connected" over a dead interface
  # (the macOS network.server incident). CodeQL reads the wait as a blocking
  # call on a non-main queue, which it is, and which is correct here.
  - exclude:
      id: swift/blocking-call-on-main-thread
