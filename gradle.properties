org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Suppress disabled-target warnings on Linux CI (iOS Kotlin/Native targets only build on macOS)
kotlin.native.ignoreDisabledTargets=true

# -- AGP 9: built-in Kotlin is OFF, and must stay off while KSP is in the build --
#
# AGP 9 bundles its own Kotlin support and, by default, REJECTS the
# `org.jetbrains.kotlin.android` plugin outright:
#   "The 'org.jetbrains.kotlin.android' plugin is no longer required for Kotlin
#    support since AGP 9.0."  (b/438678642)
#
# But AGP's built-in Kotlin does not work with KSP, and AGP says so itself:
#   "KSP is not compatible with Android Gradle Plugin's built-in Kotlin. Please
#    disable by adding android.builtInKotlin=false to gradle.properties and
#    apply kotlin(\"android\") plugin"
#
# KSP is not optional here -- it runs the Hilt compiler (hilt-compiler is a
# ksp(...) dependency in app/build.gradle.kts). Dagger's annotation processing
# is what generates the whole DI graph, so "drop KSP" means "drop Hilt".
#
# So this flag and the kotlin.android plugin are a PAIR: removing either one
# alone breaks the build. Revisit only when KSP ships built-in-Kotlin support,
# and then remove BOTH together.
android.builtInKotlin=false

# -- AGP 9: legacy DSL, deliberately. Read this before "modernising" it away. --
#
# `android.newDsl` defaults to TRUE in AGP 9. It is FeatureStage.SoftlyEnforced
# and disappears in AGP 10, so this flag is a DATED LOAN, not a resting place.
#
# It is set to false because with newDsl=true this project cannot configure AT
# ALL. Measured on this branch, AGP 9.4.0 / Gradle 9.7.1:
#
#   org.jetbrains.kotlin.android 2.2.21 ->
#     "class com.android.build.gradle.internal.dsl.ApplicationExtensionImpl
#      $AgpDecorated_Decorated cannot be cast to class
#      com.android.build.gradle.BaseExtension"
#
# The obvious escape -- drop kotlin.android and use AGP 9's built-in Kotlin --
# is closed, because AGP's built-in Kotlin does not support KSP, and KSP runs
# the Hilt compiler. AGP says so itself (see android.builtInKotlin below). So
# the two flags are one decision: kotlin.android + KSP + Hilt requires the
# legacy DSL today.
#
# And this is NOT fixed by moving Kotlin forward. Extracted class counts of
# references to com/android/build/gradle/BaseExtension in the Kotlin Gradle
# plugin jar:
#
#   kotlin-gradle-plugin 2.2.21   12968 classes,  18 BaseExtension refs
#   kotlin-gradle-plugin 2.3.21   13622 classes,  19 BaseExtension refs
#
# i.e. the newest Kotlin at time of writing still carries MORE of them, so
# bumping Kotlin would not have bought newDsl=true -- it would only have added a
# Compose-compiler, serialization, KSP and Kotlin/Native framework bump to a
# toolchain migration, with an App Store submission in flight.
#
# THE EXIT, when KSP supports AGP's built-in Kotlin or KGP drops BaseExtension:
# delete this flag and android.builtInKotlin below, and re-run the release gates.
# The one piece of AGP-10 work that did NOT have to wait is already done -- the
# native-integrity producer in app/build.gradle.kts no longer uses
# `android.applicationVariants` (removed under newDsl=true, gone in AGP 10); it
# iterates names collected from androidComponents.onVariants, which is the
# supported API in both modes.
android.newDsl=false

# -- R8 / shrinker flags: what is already on, and what must NOT be added --
#
# Deliberately EMPTY. Every flag below was read out of AGP 8.11.2's own
# BooleanOption table (javap on
# com/android/build/gradle/options/BooleanOption.class inside gradle-8.11.2.jar)
# rather than out of documentation, and none of them is worth setting. Recorded
# here so the next person does not "enable R8 full mode" and ship a diff that
# changes nothing.
#
#   android.enableR8.fullMode          BooleanOption.FULL_R8
#       default TRUE (the constructor pushes iconst_1), FeatureStage.Supported.
#       FULL MODE IS ALREADY ON and has been for the life of this AGP. Adding
#       the flag is a no-op. app/proguard-rules.pro is written for full mode.
#
#   android.r8.strictFullModeForKeepRules   default FALSE, Supported.
#       Not enabled. It makes -keep rules STRICTER -- a kept class no longer
#       implies its default constructor -- i.e. more aggressive, and the
#       consequences here cannot be verified without a device test.
#
#   android.r8.optimizedShrinking           default FALSE, EXPERIMENTAL.
#       Not enabled. A VPN client whose failure mode is "nobody can connect" is
#       the wrong place to run an experimental shrinker pipeline.
#
#   android.r8.failOnMissingClasses         default TRUE, Enforced since AGP 8.0.
#       This is why the -dontwarn lines in app/proguard-rules.pro are
#       load-bearing even though they keep nothing.
#
# And one directive that does NOT belong in app/proguard-rules.pro either:
#   -allowaccessmodification   already supplied by AGP, and verified: it is the
#                              ENTIRE content of proguard-optimizations.txt
#                              inside gradle-8.11.2.jar, which is what the
#                              "-optimize" variant of the default file adds.
