org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Suppress disabled-target warnings on Linux CI (iOS Kotlin/Native targets only build on macOS)
kotlin.native.ignoreDisabledTargets=true

# -- AGP 9: built-in Kotlin and the new DSL are ON (the defaults) --
#
# Until 2026-09-13 this file carried `android.builtInKotlin=false`,
# `android.newDsl=false` and `android.sync.suppressAgpWarnings=...`, because
# KSP (which runs the Hilt compiler) did not support AGP's built-in Kotlin and
# the kotlin-android plugin needed the legacy DSL. THE EXIT those notes named
# was taken with OPEN-WORK G4: KSP 2.3.1+ supports built-in Kotlin, so the
# kotlin-android plugin is gone from :app and :baselineprofile, :shared uses
# com.android.kotlin.multiplatform.library, and every module configures the
# new DSL only. Do not reintroduce any of the three flags: the opt-outs are
# removed in AGP 10 and each one re-creates a KGP 2.4 deprecation warning that
# the zero-warning gate would fail on.

# -- R8 / shrinker flags: what is already on, and what must NOT be added --
#
# Deliberately EMPTY. Every flag below was read out of AGP 9.4.0's own
# BooleanOption table (javap -c -p on
# com/android/build/gradle/options/BooleanOption.class inside gradle-9.4.0.jar:
# the enum constructor's defaultValue and Stage arguments) rather than out of
# documentation, and none of them is worth setting. Recorded here so the next
# person does not "enable R8 full mode" or "enable optimised resource
# shrinking" and ship a diff that changes nothing.
#
# Re-read 2026-09-16 against 9.4.0: the previous version of this block was
# read out of 8.11.2, and AGP 9.0 flipped several of these defaults. The Play
# Console's "Improve your app's memory and performance with R8 optimisation"
# recommendation on 1.4.27 -- the last release built on 8.11.2 -- named
# "optimised resource shrinking" and "AGP 9.0 or higher". Both are read by
# Play out of the uploaded AAB, from BUNDLE-METADATA/com.android.tools/r8.json
# (resourceOptimization.isOptimizedShrinkingEnabled) and
# BUNDLE-METADATA/com.android.tools.build.gradle/app-metadata.properties
# (androidGradlePluginVersion), and both have been satisfied by every build
# since #363 -- verified in the shipped 1.4.28 AAB: true and 9.4.0, against
# false and 8.11.2 in the shipped 1.4.27 AAB. scripts/check_r8_keeps.py now
# asserts both on every AAB CI builds, so the warning cannot come back
# silently.
#
#   android.enableR8.fullMode          BooleanOption.FULL_R8
#       default TRUE, FeatureStage.SoftlyEnforced(VERSION_10_0) -- Supported
#       in 8.11.2. FULL MODE IS ALREADY ON and has been for the life of this
#       AGP; adding the flag is a no-op, setting it to false now raises a
#       deprecation warning (which the zero-warning gate would fail on) and
#       stops being possible in AGP 10. app/proguard-rules.pro is written for
#       full mode.
#
#   android.r8.strictFullModeForKeepRules   default TRUE, Supported
#       (FutureStage: SoftlyEnforced(VERSION_11_0) from 10.0). CHANGED: 8.11.2
#       defaulted it to FALSE and this block used to say "not enabled". Since
#       9.0 a bare `-keep class A` no longer implies `-keep class A { <init>(); }`.
#       Every -keep this repo owns carries `{ *; }`, so nothing here relies on
#       the implied constructor, and scripts/check_r8_keeps.py passes on the
#       strict build. Do not set it to false "to be safe": that is the
#       deprecated direction, and 1.4.28 already shipped strict.
#
#   android.r8.optimizedResourceShrinking   default TRUE,
#       SoftlyEnforced(VERSION_10_0). Did not exist in 8.11.2 (opt-in from
#       8.12, default true from 9.0). THIS IS THE PLAY CONSOLE ITEM. It is on
#       because isShrinkResources = true in app/build.gradle.kts, and it is
#       what took res/ in the arm64 master split from 1,174,753 bytes (1.4.27)
#       to 343,424 bytes (1.4.28) -- measured with bundletool build-apks on
#       both shipped AABs; the whole master split went 6,414,112 -> 5,957,877
#       bytes compressed.
#
#   android.r8.optimizedShrinking           FeatureStage.Removed(VERSION_8_11).
#       8.11.2's table still carried it as Experimental/false; 9.4.0's marks
#       it REMOVED. Setting it now produces an AGP "removed option" diagnostic
#       and nothing else.
#
#   android.r8.failOnMissingClasses         default TRUE, Enforced since AGP 8.0.
#       Unchanged. This is why the -dontwarn lines in app/proguard-rules.pro
#       are load-bearing even though they keep nothing.
#
#   android.r8.integratedResourceShrinking  default TRUE, Enforced (was
#       SoftlyEnforced(VERSION_9_0)). android.enableNewResourceShrinker and
#       android.enableNewResourceShrinker.preciseShrinking: default TRUE,
#       Enforced. android.enableResourceOptimizations: default TRUE,
#       SoftlyEnforced(VERSION_9_0). This is the resource pipeline that writes
#       app/build/outputs/mapping/release/resources.txt (2,521 reachable /
#       1,527 removed on the 2026-09-16 build); none of the four can be
#       usefully set.
#
#   android.proguard.failOnMissingFiles     default TRUE,
#       SoftlyEnforced(VERSION_10_0) -- was FALSE, Experimental. A
#       proguardFiles() entry that does not exist on disk now fails the build
#       instead of being ignored. Both of ours exist.
#
#   android.r8.proguardAndroidTxt.disallowed   default TRUE,
#       SoftlyEnforced(VERSION_10_0). New in 9.0. getDefaultProguardFile()
#       accepts only proguard-android-optimize.txt now, which is the one
#       app/build.gradle.kts already names; the non-optimize variant carried
#       -dontoptimize.
#
#   android.experimental.r8.enableR8ConfigurationAnalyzer   default TRUE,
#       Experimental. New in 9.x. It is why configanalyzer.html / .pb appear
#       next to mapping.txt: a per-rule report of what each keep froze. The
#       r8-reports-pr CI artifact carries it, and 9.3+ has a standalone
#       :app:analyzeReleaseR8Config task.
#
# And one directive that does NOT belong in app/proguard-rules.pro either:
#   -allowaccessmodification   already supplied by AGP, and verified: it is the
#                              ENTIRE content of proguard-optimizations.txt
#                              inside gradle-9.4.0.jar (byte-identical to the
#                              8.11.2 copy), which is what the "-optimize"
#                              variant of the default file adds.
#
# Daemon heap (org.gradle.jvmargs, line 1): measured 2026-09-16 with -Xlog:gc*
# on the daemons that ran assembleRelease and bundleRelease -PplayBuild=true
# (R8 in-process, as in CI): peak live after GC 1834M of 2048M on
# assembleRelease, 1784M with two G1 "Evacuation Failure" pauses on
# bundleRelease; no Full GC, no OOM, 3.5s total GC pause. That is roughly 10%
# headroom. If R8 ever fails with OutOfMemoryError in CI, -Xmx3072m is the
# fix -- not a shrinker flag, and not android.r8.maxWorkers.
