org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Suppress disabled-target warnings on Linux CI (iOS Kotlin/Native targets only build on macOS)
kotlin.native.ignoreDisabledTargets=true

# -- R8 / shrinker flags: what is already on, and what must NOT be added --
#
# Deliberately EMPTY. Every flag below was read out of AGP 8.11.2's own
# BooleanOption table (javap on
# com/android/build/gradle/options/BooleanOption.class inside gradle-8.11.2.jar)
# rather than out of documentation, and none of them is worth setting. Recorded
# here so the next person does not "enable R8 full mode" and ship a diff that
# changes nothing.
#
#   android.enableR8.fullMode          BooleanOption.FULL_R8
#       default TRUE (the constructor pushes iconst_1), FeatureStage.Supported.
#       FULL MODE IS ALREADY ON and has been for the life of this AGP. Adding
#       the flag is a no-op. app/proguard-rules.pro is written for full mode.
#
#   android.r8.strictFullModeForKeepRules   default FALSE, Supported.
#       Not enabled. It makes -keep rules STRICTER -- a kept class no longer
#       implies its default constructor -- i.e. more aggressive, and the
#       consequences here cannot be verified without a device test.
#
#   android.r8.optimizedShrinking           default FALSE, EXPERIMENTAL.
#       Not enabled. A VPN client whose failure mode is "nobody can connect" is
#       the wrong place to run an experimental shrinker pipeline.
#
#   android.r8.failOnMissingClasses         default TRUE, Enforced since AGP 8.0.
#       This is why the -dontwarn lines in app/proguard-rules.pro are
#       load-bearing even though they keep nothing.
#
# And one directive that does NOT belong in app/proguard-rules.pro either:
#   -allowaccessmodification   already supplied by AGP, and verified: it is the
#                              ENTIRE content of proguard-optimizations.txt
#                              inside gradle-8.11.2.jar, which is what the
#                              "-optimize" variant of the default file adds.
