name: BirdoVPN
options:
  bundleIdPrefix: app.birdo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # ── App version ──────────────────────────────────────────────
    # Both Info.plists read $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION), and
    # CI overrides these on the xcodebuild command line from version.properties
    # — the single source of truth shared with Android.
    #
    # These values are a DELIBERATE SENTINEL, not a version to keep in sync. A
    # real-looking default here is exactly how the old hardcoded 1.0.0 shipped
    # unnoticed for months: it was indistinguishable from a genuine release. A
    # build reporting 0.0.0-dev is obviously a local one and can never be
    # mistaken for, or silently ship as, a release.
    MARKETING_VERSION: "0.0.0-dev"
    CURRENT_PROJECT_VERSION: "0"
    # "1" = iPhone only. An iPhone-only app still INSTALLS and runs on iPad in
    # scaled compatibility mode, which is enough to test the packet tunnel on
    # real hardware. Set to "1,2" only if you intend to ship native iPad layouts
    # (App Review will then expect proper iPad UI).
    TARGETED_DEVICE_FAMILY: "1"
    # Team is KPUFGR98A5 (Phillip Bird), taken from BirdoVPN_App_Store_Profile.
    # Declared here so Xcode's automatic signing survives `xcodegen generate` —
    # setting it only in Xcode's UI is wiped on the next regeneration.
    DEVELOPMENT_TEAM: KPUFGR98A5
    # MANUAL signing for release/archive. Automatic signing cannot be used
    # headlessly for an App Store archive: xcodebuild resolves it to an
    # "iOS App Development" profile, which Apple refuses to issue unless the
    # team has at least one REGISTERED DEVICE ("Your team has no devices from
    # which to generate a provisioning profile"). App Store distribution
    # profiles need no devices, so we pin them explicitly per target below.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Distribution"

# WireGuardKit ships the Go tunnel runtime + WireGuardAdapter used by both
# the host app (for type-safe TunnelConfiguration) and the PacketTunnel
# extension (to actually carry packets).
packages:
  WireGuardKit:
    # VENDORED at iosApp/Vendor/wireguard-apple (tag 1.0.15-26 + 3 local patches).
    # Upstream git.zx2c4.com/wireguard-apple is DORMANT (last commit 2023-02-15) and
    # its master (= tag 1.0.16-27) has an INVALID manifest: swift-tools-version:5.3
    # while using .macOS(.v12)/.iOS(.v15), which require 5.5 — SwiftPM under Xcode 16
    # refuses to resolve it at all, so `branch: master` could never build.
    # Local patches (all required to compile under Xcode 16 / Go 1.23+):
    #   1. WireGuardKitC.h  +=  #include <sys/types.h>   (explicit modules reject
    #      the implicit u_int32_t/u_char/u_int16_t declarations)
    #   2. TunnelConfiguration+WgQuickConfig.swift and String+ArrayConversion.swift
    #      moved into Sources/WireGuardKit and made public — upstream keeps the
    #      wg-quick parser in the APP sources, so the library never exported the
    #      TunnelConfiguration(fromWgQuickConfig:called:) init we call.
    #   3. Sources/WireGuardKitGo/Makefile -> go build -ldflags='-w -checklinkname=0'
    #      (Go 1.23+ rejects x/net's old //go:linkname into syscall.recvmsg).
    path: Vendor/wireguard-apple

targets:
  BirdoVPN:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - Info.plist
    # NOTE: deliberately NO `info:` / `entitlements:` blocks. XcodeGen *generates*
    # (i.e. overwrites) whatever file those keys name — which silently wiped the
    # hand-written Info.plist and emptied BirdoVPN.entitlements to `<dict/>` on
    # every `xcodegen generate`. The real files are referenced via INFOPLIST_FILE
    # and CODE_SIGN_ENTITLEMENTS below, which leaves them untouched.
    # For the same reason the `birdo` custom URL scheme (SSO PKCE callback +
    # deep links) is registered directly in iosApp/Info.plist (CFBundleURLTypes)
    # — never add it here via an `info:` block.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.birdo.vpn
        INFOPLIST_FILE: iosApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: iosApp/BirdoVPN.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Birdo VPN AppStore v2"
        # Compiles iosApp/Assets.xcassets and emits CFBundleIconName, without
        # which App Store validation fails. The source PNG must be 1024x1024
        # with NO alpha channel — Apple rejects icons that have one.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # MUST be repeated at target level: XcodeGen's built-in settings preset
        # for `type: application` injects CODE_SIGN_IDENTITY = "iPhone Developer",
        # which outranks the project-level value and breaks the archive with
        # "No signing certificate 'iOS Development' found". (The app-extension
        # preset has no such default, which is why only this target broke.)
        CODE_SIGN_IDENTITY: "Apple Distribution"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework"
          - "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "BirdoShared"
    dependencies:
      - target: PacketTunnel
      - package: WireGuardKit
        product: WireGuardKit
      # AUDIT-C1: BirdoPQNative.xcframework wraps the Rust ML-KEM-1024
      # library at native/birdo-pq-ios. Build it on a macOS host with
      # `scripts/build-birdo-pq-xcframework.sh` (one-shot; output lives at
      # iosApp/Vendor/BirdoPQNative.xcframework and is checked into the
      # binary cache for the iOS pipeline). The Swift `BirdoPQManager`
      # talks to it via the C ABI declared in `birdo_pq_ios.h`.
      - framework: Vendor/BirdoPQNative.xcframework
        embed: false

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
    # NOTE: deliberately NO `info:` / `entitlements:` blocks — see the BirdoVPN
    # target above. Regenerating these stripped the NSExtension dict (so the
    # packet-tunnel provider could never load) and emptied the
    # packet-tunnel-provider entitlement.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.birdo.vpn.tunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "Birdo VPN Tunnel AppStore"
        # Pinned explicitly here too, so this target does not silently inherit a
        # different identity if XcodeGen's extension preset ever gains one.
        CODE_SIGN_IDENTITY: "Apple Distribution"
        # DO NOT link BirdoShared (the KMP Kotlin/Native framework) here. The
        # extension sources import only NetworkExtension / Security / WireGuardKit
        # / os.log — none of the Kotlin code. Linking it made dyld load the entire
        # Kotlin/Native runtime into the packet-tunnel extension at startup, and
        # that runtime's memory footprint, on top of the Go WireGuard runtime that
        # spins up in adapter.start(), blew the NEProvider ~50 MB memory ceiling —
        # the extension was jetsam-killed the instant it called adapter.start
        # (breadcrumb stuck at "calling adapter.start", no callback, no crash from
        # our code). The simulator has no such memory cap, which is why it only
        # ever died on hardware. Keep this target lean: WireGuardKit + system only.
        OTHER_LDFLAGS:
          - "$(inherited)"
          # FORCE-LOAD libwg-go.a. WireGuardKit links it as a plain `-lwg-go`
          # (.linkedLibrary), but the Go c-archive registers its runtime-init
          # constructor in __DATA,__mod_init_func — and Xcode 26's default linker
          # (ld_prime) drops that section from a plainly-linked static archive
          # under Release optimisation. With the constructor stripped the Go
          # runtime never initialises, so the FIRST cgo call (wgSetLogger, made by
          # WireGuardAdapter.start) hits the `_cgo_wait_runtime_init_done` guard
          # and dies with EXC_BAD_INSTRUCTION/SIGILL — the exact on-device crash
          # (thread on com.apple.NSXPCConnection.user.endpoint, frames
          # _cgo_wait_runtime_init_done <- wgSetLogger). force_load pulls every
          # object (constructor included) so the runtime inits. The Debug
          # simulator build keeps the section, which is why it only died on
          # hardware. $(PLATFORM_NAME) resolves to iphoneos / iphonesimulator,
          # matching the .build-wg/<platform>/ layout ios.yml and setup-ios.sh
          # produce, and $(SRCROOT) is iosApp/ for this project.
          - "-Wl,-force_load,$(SRCROOT)/.build-wg/$(PLATFORM_NAME)/libwg-go.a"
    dependencies:
      - package: WireGuardKit
        product: WireGuardKit
