# Honest disclosure (also stated in the Description):
#  - NonFreeNet: requires a BirdoVPN account + Birdo's servers to function.
#  - NonFreeDep: bundles prebuilt native components (Xray, WireGuard-go) and
#    Google's proprietary Play Billing and Play Integrity libraries. This is
#    the same APK as GitHub Releases; both libraries are compiled in and are
#    active only in the Google Play build (BuildConfig.IS_PLAY_BUILD).
#  - Tracking: the APK contains the Sentry crash-reporting SDK. It is OFF by
#    default and starts only if the user turns it on (consent screen or
#    Settings); no sessions, no account data. Declared anyway, because the
#    reporter ships in this APK and a privacy audience should see it listed
#    (audit 2026-09-29, D-11 / C-3).
AntiFeatures:
