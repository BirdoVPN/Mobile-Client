AutoName: BirdoVPN
Summary: Private WireGuard VPN with a post-quantum key exchange

# Audit 2026-09-29 (D-11): the description named Rosenpass, which no platform
# uses (BirdoPQ is ML-KEM-1024, KEM-only), and promised that captured traffic
# "cannot be decrypted by a future quantum computer". Wording now follows
# AUDIT-2026-09-29/REMEDIATION-DECISIONS.md sections 1-2.
Description: |-
  BirdoVPN is a private VPN built on WireGuard, with a post-quantum key
  exchange, a kill switch and no activity logs.

  No activity logs: our VPN servers don't record the sites you visit, your DNS
  queries or your traffic. While you're connected, our account system keeps a
  live record of your session (server, device, connect time). It is deleted
  when you disconnect and is left out of our nightly backups. Our daily
  encrypted copy of the database files (kept 4 days, used for point-in-time
  recovery) does not contain it either. We also count your
  data use per billing period.

  Post-quantum key exchange: each connection adds a WireGuard pre-shared key
  derived with ML-KEM-1024 (BirdoPQ) between your app and our API. The key is
  then delivered to the VPN server over TLS that is not yet post-quantum, so
  protection against "record now, decrypt later" is only as strong as that
  link today.

  Features:

  * Kill switch: if the tunnel drops unexpectedly, the app blocks traffic
    until it reconnects. Protection applies while BirdoVPN's VPN service is
    running. To stay blocked even if the app is closed, turn on Android's
    Always-on VPN and Block connections without VPN for BirdoVPN
  * Split tunnelling: choose which apps use the VPN
  * Your DNS requests go through the encrypted tunnel
  * An optional stealth transport for networks that block VPN traffic
    (Operative and Sovereign plans)
  * Multi-hop (Sovereign plan): your traffic enters one server and leaves
    from another, so sites see the exit server's address. It is not onion
    routing: the entry server can see your IP address and the destinations
    you connect to
  * Accounts can be created without an email address

  Crash reporting: the app contains the Sentry crash-reporting SDK. It is off
  by default and sends nothing unless you turn it on (on the first screen, or
  later in Settings). When on, it sends crash and error reports: crashes, and
  errors when an app feature such as connecting or the kill switch fails, with
  the app and OS version and device model. No account details, IP address or
  browsing data.

  This build is distributed outside Google Play and is signed with Birdo's own
  release key. It is the same APK published on GitHub Releases. A BirdoVPN
  account is required to connect to the network. The apps are
  source-available (CC BY-NC 4.0); the server code is private. The service
  has not yet been independently audited.

  Note: the app bundles prebuilt native networking components (Xray and
  WireGuard-go) and Google's Play Billing and Play Integrity libraries (used
  only in the Google Play build), which is why it is served from this
  self-hosted repository rather than the main f-droid.org catalogue.

