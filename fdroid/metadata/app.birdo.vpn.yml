# own apksigner pin (fdroid.yml) can never enter the index. The fingerprint is
# the PUBLIC release/upload-key certificate SHA-256 (docs/PLAY-APP-SIGNING.md),
# lowercase hex as fdroidserver expects.
AllowedAPKSigningKeys:
